<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO Range Viewer Pro</title>
    <style>
        /* 现代扑克软件暗黑配色方案 */
        :root {
            --bg-body: #0b0f19;
            --bg-panel: #151b2b;
            --border-color: #2a3441;
            
            --color-raise: #ef4444; /* 红色：加注 */
            --color-call:  #10b981; /* 绿色：跟注 */
            --color-fold:  #1f2937; /* 灰色：弃牌 */
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-md: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0 0 8px 0; font-size: 24px; }
        .header p { margin: 0; color: var(--text-muted); font-size: 14px; }

        #loading-msg {
            color: #3b82f6;
            font-size: 18px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px dashed #3b82f6;
        }

        .controls-container {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            color: var(--text-main);
            background: #2a3441;
        }

        button.active {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; }
        .bg-raise { background-color: var(--color-raise); }
        .bg-call  { background-color: var(--color-call); }
        .bg-fold  { background-color: var(--color-fold); }

        .grid-wrapper {
            background: var(--bg-panel);
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background-color: var(--bg-body);
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
        }

        .hand-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        .hand-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            pointer-events: none;
        }
