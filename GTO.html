<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO Range Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0 0 8px 0; font-size: 24px; }
        
        .controls-container {
            background: #151b2b;
            border: 1px solid #2a3441;
            border-radius: 8px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #2a3441; color: #fff; }
        button.active { background: #3b82f6; color: #fff; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 12px;
            border-top: 1px solid #2a3441;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background-color: #0b0f19;
            border: 1px solid #2a3441;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            padding: 10px;
            box-sizing: border-box;
        }

        .hand-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            cursor: pointer;
            user-select: none;
        }
        .hand-cell:hover { outline: 2px solid #fff; z-index: 10; }

        #tooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GTO Range Viewer</h1>
    </div>

    <div class="controls-container">
        <div class="button-group" id="table-type-controls">
            <button class="active" onclick="setTableType('6max')">6人桌</button>
            <button onclick="setTableType('9max')">9人桌</button>
        </div>
        <div class="button-group" id="position-controls"></div>
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background:#ef4444;"></div> 加注</div>
            <div class="legend-item"><div class="color-box" style="background:#10b981;"></div> 跟注</div>
            <div class="legend-item"><div class="color-box" style="background:#1f2937;"></div> 弃牌</div>
        </div>
    </div>

    <div class="grid-container" id="matrix-grid"></div>
    <div id="tooltip"></div>

    <script>
        const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        let currentTableType = '6max';
        let currentPosition = 'UTG';
        const tooltip = document.getElementById('tooltip');

        const positions = {
            '6max': ['UTG', 'HJ', 'CO', 'BTN', 'SB'],
            '9max': ['UTG', 'UTG+1', 'UTG+2', 'LJ', 'HJ', 'CO', 'BTN', 'SB']
        };

        const mockData = {
            '6max': {
                'UTG': { 
                    'AA':{r:100}, 'KK':{r:100}, 'QQ':{r:100}, 'JJ':{r:100}, 'TT':{r:100}, '99':{r:100}, '88':{r:100}, 
                    '77':{r:50, c:50}, '66':{r:20, c:30},
                    'AKs':{r:100}, 'AQs':{r:100}, 'AJs':{r:100}, 'ATs':{r:100}, 'A5s':{r:60}, 'A4s':{r:40}, 
                    'KQs':{r:100}, 'KJs':{r:100}, 'KTs':{r:20}, 'QJs':{r:100}, 'JTs':{r:100}, 'T9s':{r:100}, 
                    '98s':{r:80, c:20}, '87s':{r:50}, 
                    'AKo':{r:100}, 'AQo':{r:100}, 'AJo':{r:20}
                },
                'BTN': { 
                    'AA':{r:100}, '22':{r:100}, 'AKs':{r:100}, 'A2s':{r:100}, 'K2s':{r:80, c:20}, 
                    'Q5s':{r:70}, 'J7s':{r:50}, 'T7s':{r:60}, '96s':{r:40}, '85s':{r:50}, '75s':{r:60}, '64s':{r:40}, '54s':{r:50}, 
                    'AKo':{r:100}, 'A2o':{r:80}, 'KQo':{r:100}, 'K9o':{r:60}, 'Q9o':{r:60}, 'J9o':{r:50}, 'T9o':{r:50} 
                }
            },
            '9max': {
                'UTG': { 'AA':{r:100}, '88':{r:50}, 'AKs':{r:100}, 'AQo':{r:50} }
            }
        };

        function renderPositionButtons() {
            const container = document.getElementById('position-controls');
            container.innerHTML = '';
            const currentPositions = positions[currentTableType];
            
            if (!currentPositions.includes(currentPosition)) {
                currentPosition = currentPositions[0];
            }

            currentPositions.forEach(pos => {
                const btn = document.createElement('button');
                btn.innerText = pos;
                if (pos === currentPosition) btn.className = 'active';
                btn.onclick = () => {
                    currentPosition = pos;
                    renderPositionButtons();
                    renderGrid();
                };
                container.appendChild(btn);
            });
        }

        function setTableType(type) {
            currentTableType = type;
            const btns = document.getElementById('table-type-controls').children;
            btns[0].className = type === '6max' ? 'active' : '';
            btns[1].className = type === '9max' ? 'active' : '';
            renderPositionButtons();
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            
            const tableData = mockData[currentTableType] || {};
            const currentRangeData = tableData[currentPosition] || {};

            for (let i = 0; i < 13; i++) {
                for (let j = 0; i < 13; j++) {
                    let handStr = '';
                    if (i < j) { handStr = ranks[i] + ranks[j] + 's'; } 
                    else if (i > j) { handStr = ranks[j] + ranks[i] + 'o'; } 
                    else { handStr = ranks[i] + ranks[j]; }

                    const actions = currentRangeData[handStr] || { r: 0, c: 0 };
                    const r = actions.r || 0; 
                    const c = actions.c || 0; 
                    const f = 100 - r - c;    

                    const cell = document.createElement('div');
                    cell.className = 'hand-cell';
                    cell.innerText = handStr;

                    const p1 = r;
                    const p2 = r + c;
                    cell.style.background = `linear-gradient(to top, #ef4444 0%, #ef4444 ${p1}%, #10b981 ${p1}%, #10b981 ${p2}%, #1f2937 ${p2}%, #1f2937 100%)`;

                    cell.onmouseenter = (e) => {
                        tooltip.innerHTML = `<strong>${handStr}</strong><br>加注: ${r}%<br>跟注: ${c}%<br>弃牌: ${f}%`;
                        tooltip.style.display = 'block';
                    };
                    cell.onmousemove = (e) => {
                        tooltip.style.left = (e.clientX + 15) + 'px';
                        tooltip.style.top = (e.clientY + 15) + 'px';
                    };
                    cell.onmouseleave = () => {
                        tooltip.style.display = 'none';
                    };

                    grid.appendChild(cell);
                }
            }
        }

        // 直接强制执行初始化，放弃所有监听器，保证 100% 刷出
        renderPositionButtons();
        renderGrid();
    </script>
</body>
</html>
