<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100BB 现金桌 GTO 策略库</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-panel: #151b2b;
            --border-color: #2a3441;
            --color-raise: #ef4444; /* 红色: 加注 / 3-Bet */
            --color-call:  #10b981; /* 绿色: 跟注 / Limp */
            --color-fold:  #1f2937; /* 灰色: 弃牌 */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0 0 8px 0; font-size: 26px; color: #fff; }
        .header p { margin: 0; color: #3b82f6; font-size: 14px; font-weight: 600; }

        .controls-container {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .filter-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
        }
        .filter-row:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }

        .filter-label {
            width: 90px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: bold;
            padding-top: 6px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        button {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: #2a3441; color: #fff; }
        button.active { background: #3b82f6; color: #fff; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .legend-item span {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 4px;
            margin-right: 6px;
            vertical-align: -2px;
        }

        .grid-wrapper {
            background: var(--bg-panel);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background-color: var(--bg-body);
            width: 100%;
            max-width: 650px;
            aspect-ratio: 1 / 1;
        }

        .hand-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        .hand-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            pointer-events: none;
        }
        .hand-cell:hover::after { border-color: #ffffff; z-index: 10; }

        #tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .tt-title { font-weight: bold; font-size: 16px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 2px;}
        .tt-row { display: flex; justify-content: space-between; gap: 30px; }
    </style>
</head>

        function setAction(action) {
            currentAction = action;
            currentScenario = config[action].scenarios[0];
            
            const btns = document.getElementById('action-btns').children;
            btns[0].className = action === 'RFI' ? 'active' : '';
            btns[1].className = action === 'vsOpen' ? 'active' : '';
            btns[2].className = action === 'HU' ? 'active' : '';
            
            document.getElementById('scenario-label').innerText = config[action].label;
            
            // 动态更新图例文字
            if(action === 'RFI') {
                document.getElementById('legend-raise').innerHTML = '<span style="background: var(--color-raise);"></span>加注 (Raise)';
                document.getElementById('legend-call').innerHTML = '<span style="background: var(--color-call);"></span>平跟 (Limp/SB)';
            } else {
                document.getElementById('legend-raise').innerHTML = '<span style="background: var(--color-raise);"></span>再加注 (3-Bet)';
                document.getElementById('legend-call').innerHTML = '<span style="background: var(--color-call);"></span>跟注 (Call)';
            }

            renderScenarios();
            renderGrid();
        }

        function renderScenarios() {
            const container = document.getElementById('scenario-btns');
            container.innerHTML = '';
            
            config[currentAction].scenarios.forEach(scen => {
                const btn = document.createElement('button');
                btn.innerText = scen;
                if (scen === currentScenario) btn.className = 'active';
                btn.onclick = () => { currentScenario = scen; renderScenarios(); renderGrid(); };
                container.appendChild(btn);
            });
        }

        function renderGrid() {
            const matrix = document.getElementById('matrix-grid');
            const tooltip = document.getElementById('tooltip');
            matrix.innerHTML = '';
            
            const actionData = db[currentAction] || {};
            const rangeData = actionData[currentScenario] || {};

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let handStr = '';
                    if (i < j) handStr = cards[i] + cards[j] + 's';
                    else if (i > j) handStr = cards[j] + cards[i] + 'o';
                    else handStr = cards[i] + cards[j];

                    const action = rangeData[handStr] || { r: 0, c: 0 };
                    const r = action.r || 0; 
                    const c = action.c || 0; 
                    const f = 100 - r - c;    

                    const cell = document.createElement('div');
                    cell.className = 'hand-cell';
                    cell.innerText = handStr;

                    // 高级渲染：精确渐变色
                    cell.style.background = `linear-gradient(to top, 
                        var(--color-raise) 0%, var(--color-raise) ${r}%, 
                        var(--color-call) ${r}%, var(--color-call) ${r+c}%, 
                        var(--color-fold) ${r+c}%, var(--color-fold) 100%)`;

                    // 悬浮窗交互
                    cell.addEventListener('mouseenter', () => {
                        let rLabel = currentAction === 'RFI' ? 'Raise' : '3-Bet';
                        let cLabel = currentAction === 'RFI' ? 'Limp' : 'Call';
                        
                        tooltip.innerHTML = `
                            <div class="tt-title">${handStr}</div>
                            <div class="tt-row"><span style="color:#fca5a5;">${rLabel}:</span> <span>${r}%</span></div>
                            <div class="tt-row"><span style="color:#6ee7b7;">${cLabel}:</span> <span>${c}%</span></div>
                            <div class="tt-row"><span style="color:#9ca3af;">Fold:</span> <span>${f}%</span></div>
                        `;
                        tooltip.style.opacity = '1';
                    });

                    cell.addEventListener('mousemove', (e) => {
                        tooltip.style.left = (e.clientX + 15) + 'px';
                        tooltip.style.top = (e.clientY + 15) + 'px';
                    });

                    cell.addEventListener('mouseleave', () => {
                        tooltip.style.opacity = '0';
                    });

                    matrix.appendChild(cell);
                }
            }
        }

        // 初始化
        renderScenarios();
        renderGrid();
    </script>
