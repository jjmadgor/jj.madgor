<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 禁用缩放，强制移动端 1:1 显示，解决误触乱晃 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA 声明 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GTO Pro</title>
    <style>
        :root {
            --bg-body: #000000;
            --bg-panel: #151b2b;
            --color-raise: #ff453a; 
            --color-call:  #32d74b; 
            --color-fold:  #1c1c1e; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: #fff;
            margin: 0;
            padding: 20px 10px 100px 10px; /* 底部留白给固定面板 */
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation; /* 优化触控响应速度 */
        }

        .controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* 隐藏滚动条 */
        .controls::-webkit-scrollbar { display: none; }

        button {
            flex-shrink: 0;
            background: #1c1c1e;
            color: #86868b;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button.active { background: #0a84ff; color: #fff; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 2px;
            width: 100%;
            max-width: 500px;
            background: #000;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            border-radius: 2px;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* 去除点击闪烁 */
        }

        /* 移动端底部固定信息面板 */
        #bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            padding: 15px 20px 30px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 1000;
        }

        #bottom-panel.show { transform: translateY(0); }

        .bp-hand { font-size: 24px; font-weight: 800; color: #fff; }
        .bp-stats { display: flex; gap: 15px; font-size: 14px; font-weight: 600; }
        .bp-stats span { display: flex; flex-direction: column; align-items: center; }
        .bp-val { font-size: 18px; margin-top: 2px; }

        @media (max-width: 400px) {
            .cell { font-size: 10px; }
            body { padding: 10px 5px 100px 5px; }
        }
    </style>
</head>
<body>

    <div class="controls" id="pos-btns">
        <!-- 按钮由JS动态生成 -->
    </div>

    <div class="grid-container" id="matrix"></div>

    <!-- 手机端沉浸式底部面板 -->
    <div id="bottom-panel">
        <div class="bp-hand" id="bp-title">AKs</div>
        <div class="bp-stats">
            <span style="color: var(--color-raise);">Raise<div class="bp-val" id="bp-r">0%</div></span>
            <span style="color: var(--color-call);">Call<div class="bp-val" id="bp-c">0%</div></span>
            <span style="color: #86868b;">Fold<div class="bp-val" id="bp-f">0%</div></span>
        </div>
    </div>

    <script>
        const cards = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        const positions = ['UTG', 'HJ', 'CO', 'BTN', 'SB'];
        let curPos = 'UTG';
        
        // 声明一个空字典用于存放从外部加载的数据
        let db = {};

        // 异步获取外部 JSON 数据 (架构解耦核心)
        async function loadData() {
            try {
                // 在本地开发时，由于浏览器跨域限制，这里可能会报错。
                // 推上 GitHub Pages 后，fetch 会完美执行。
                // 作为兜底，你可以把上个版本的静态字典写在这里当 fallback。
                const response = await fetch('data/rfi_100bb.json'); 
                if (response.ok) {
                    db = await response.json();
                }
            } catch (error) {
                console.error("加载外部数据失败，请确保运行在服务器环境下:", error);
            }
            renderPositions();
            renderMatrix();
        }

        function renderPositions() {
            const container = document.getElementById('pos-btns');
            container.innerHTML = '';
            positions.forEach(pos => {
                const btn = document.createElement('button');
                btn.innerText = pos;
                if (pos === curPos) btn.className = 'active';
                btn.onclick = () => { curPos = pos; renderPositions(); renderMatrix(); };
                container.appendChild(btn);
            });
        }

        function renderMatrix() {
            const matrix = document.getElementById('matrix');
            const bottomPanel = document.getElementById('bottom-panel');
            matrix.innerHTML = '';
            
            const rangeData = db[curPos] || {};

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let hand = '';
                    if (i < j) hand = cards[i] + cards[j] + 's';
                    else if (i > j) hand = cards[j] + cards[i] + 'o';
                    else hand = cards[i] + cards[j];

                    const action = rangeData[hand] || { r: 0, c: 0 };
                    const r = action.r || 0; 
                    const c = action.c || 0; 
                    const f = 100 - r - c;    

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = hand;
                    cell.style.background = `linear-gradient(to top, var(--color-raise) ${r}%, var(--color-call) ${r}% ${r+c}%, var(--color-fold) ${r+c}%)`;

                    // 移动端交互逻辑：点击/触摸显示底部面板
                    const showData = () => {
                        document.getElementById('bp-title').innerText = hand;
                        document.getElementById('bp-r').innerText = r + '%';
                        document.getElementById('bp-c').innerText = c + '%';
                        document.getElementById('bp-f').innerText = f + '%';
                        bottomPanel.classList.add('show');
                        
                        // 清除其他格子的高亮，高亮当前格子
                        document.querySelectorAll('.cell').forEach(c => c.style.outline = 'none');
                        cell.style.outline = '2px solid #fff';
                        cell.style.zIndex = '2';
                    };

                    cell.addEventListener('mousedown', showData);
                    cell.addEventListener('touchstart', (e) => { e.preventDefault(); showData(); });

                    matrix.appendChild(cell);
                }
            }
        }

        // 点击空白处隐藏底部面板
        document.body.addEventListener('click', (e) => {
            if (!e.target.classList.contains('cell') && !document.getElementById('bottom-panel').contains(e.target)) {
                document.getElementById('bottom-panel').classList.remove('show');
                document.querySelectorAll('.cell').forEach(c => c.style.outline = 'none');
            }
        });

        // 启动应用
        loadData();
    </script>
</body>
</html>
