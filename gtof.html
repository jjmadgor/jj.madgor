<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO 聚合查询系统</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0 0 5px 0; font-size: 24px; letter-spacing: 1px; }
        .header p { margin: 0; color: #94a3b8; font-size: 13px; }

        .panel {
            background: #151b2b;
            border: 1px solid #2a3441;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .filter-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }
        .filter-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .filter-label {
            width: 80px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        button {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: #2a3441; color: #fff; }
        button.active { background: #3b82f6; color: #fff; box-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a3441;
        }

        .legend-item span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background: #0b0f19;
            border: 1px solid #2a3441;
            border-radius: 8px;
            padding: 4px;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            position: relative;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            user-select: none;
            overflow: hidden;
        }

        .cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            pointer-events: none;
        }
        .cell:hover::after { border-color: #ffffff; z-index: 10; }

        #tooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            backdrop-filter: blur(4px);
            min-width: 120px;
        }

        .tt-header { font-weight: bold; font-size: 15px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 2px; }
        .tt-row { display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="header">
        <h1>GTO 范围聚合查询</h1>
        <p>多维度策略矩阵库</p>
    </div>

    <!-- 控制面板 -->
    <div class="panel">
        <div class="filter-row">
            <div class="filter-label">赛制</div>
            <div class="btn-group" id="format-btns">
                <button class="active" onclick="setFormat('MTT')">锦标赛 (MTT)</button>
                <button onclick="setFormat('Cash')">常规桌 (Cash 6-Max)</button>
            </div>
        </div>
        
        <div class="filter-row">
            <div class="filter-label">筹码深度</div>
            <div class="btn-group" id="depth-btns"></div>
        </div>

        <div class="filter-row">
            <div class="filter-label">我方位置</div>
            <div class="btn-group" id="pos-btns"></div>
        </div>

        <div class="legend">
            <div class="legend-item"><span style="background: #ef4444;"></span>加注 (Raise)</div>
            <div class="legend-item"><span style="background: #10b981;"></span>跟注 (Call)</div>
            <div class="legend-item"><span style="background: #1f2937;"></span>弃牌 (Fold)</div>
        </div>
    </div>

    <!-- 渲染网格 -->
    <div class="panel" style="padding: 10px;">
        <div class="grid" id="matrix"></div>
    </div>

    <!-- 悬浮窗 -->
    <div id="tooltip"></div>

    <script>
        const cards = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        
        // 状态管理
        let curFormat = 'MTT';
        let curDepth = '30BB';
        let curPos = 'UTG';

        // 配置结构定义
        const config = {
            'MTT': {
                depths: ['15BB', '20BB', '30BB', '40BB'],
                positions: ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB']
            },
            'Cash': {
                depths: ['100BB'],
                positions: ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB']
            }
        };

        // GTO 数据库模拟 (分层: 赛制 -> 深度 -> 位置 -> 手牌 -> 动作频率)
        const db = {
            'MTT': {
                '30BB': {
                    'UTG': { 
                        'AA':{r:100}, 'KK':{r:100}, 'QQ':{r:100}, 'JJ':{r:100}, 'TT':{r:100}, '99':{r:100}, '88':{r:100}, '77':{r:60, c:0},
                        'AKs':{r:100}, 'AQs':{r:100}, 'AJs':{r:100}, 'ATs':{r:100}, 'A5s':{r:40},
                        'KQs':{r:100}, 'KJs':{r:100}, 'QJs':{r:100}, 'JTs':{r:80},
                        'AKo':{r:100}, 'AQo':{r:100}, 'AJo':{r:30}
                    },
                    'BTN': {
                        'AA':{r:100}, '22':{r:100}, 'AKs':{r:100}, 'A2s':{r:100}, 'K2s':{r:70}, 'Q5s':{r:50}, 'J7s':{r:50},
                        'T7s':{r:60}, '96s':{r:40}, '85s':{r:50}, '75s':{r:60}, '64s':{r:40}, '54s':{r:50},
                        'AKo':{r:100}, 'A2o':{r:60}, 'KQo':{r:100}, 'K9o':{r:50}, 'Q9o':{r:50}, 'J9o':{r:40}, 'T9o':{r:40}
                    }
                },
                '15BB': {
                    'UTG': { 'AA':{r:100}, 'KK':{r:100}, 'AKs':{r:100}, 'AKo':{r:100} } // 筹码浅，打得极紧或直接 All-in
                }
            },
            'Cash': {
                '100BB': {
                    'UTG': { 'AA':{r:100}, 'KK':{r:100}, 'QQ':{r:100}, 'JJ':{r:100}, 'TT':{r:100}, '99':{r:100}, '88':{r:100}, 'AKs':{r:100}, 'AQs':{r:100}, 'AKo':{r:100} }
                }
            }
        };

        function init() {
            renderControls();
            renderMatrix();
        }

        function setFormat(format) {
            curFormat = format;
            curDepth = config[format].depths[0];
            curPos = config[format].positions[0];
            
            const btns = document.getElementById('format-btns').children;
            btns[0].className = format === 'MTT' ? 'active' : '';
            btns[1].className = format === 'Cash' ? 'active' : '';
            
            renderControls();
            renderMatrix();
        }

        function renderControls() {
            // 渲染筹码深度按钮
            const depthContainer = document.getElementById('depth-btns');
            depthContainer.innerHTML = '';
            config[curFormat].depths.forEach(depth => {
                const btn = document.createElement('button');
                btn.innerText = depth;
                if (depth === curDepth) btn.className = 'active';
                btn.onclick = () => { curDepth = depth; renderControls(); renderMatrix(); };
                depthContainer.appendChild(btn);
            });

            // 渲染位置按钮
            const posContainer = document.getElementById('pos-btns');
            posContainer.innerHTML = '';
            config[curFormat].positions.forEach(pos => {
                const btn = document.createElement('button');
                btn.innerText = pos;
                if (pos === curPos) btn.className = 'active';
                btn.onclick = () => { curPos = pos; renderControls(); renderMatrix(); };
                posContainer.appendChild(btn);
            });
        }

        function renderMatrix() {
            const matrix = document.getElementById('matrix');
            const tooltip = document.getElementById('tooltip');
            matrix.innerHTML = '';
            
            // 安全读取深层嵌套数据
            const formatData = db[curFormat] || {};
            const depthData = formatData[curDepth] || {};
            const range = depthData[curPos] || {};

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let hand = '';
                    if (i < j) hand = cards[i] + cards[j] + 's';
                    else if (i > j) hand = cards[j] + cards[i] + 'o';
                    else hand = cards[i] + cards[j];

                    const action = range[hand] || {r:0, c:0};
                    const r = action.r || 0;
                    const c = action.c || 0;
                    const f = 100 - r - c;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = hand;
                    
                    // 渐变渲染：底层红，中间绿，上层灰
                    cell.style.background = `linear-gradient(to top, #ef4444 ${r}%, #10b981 ${r}% ${r+c}%, #1f2937 ${r+c}%)`;

                    // 悬浮窗交互
                    cell.onmouseenter = () => {
                        tooltip.innerHTML = `
                            <div class="tt-header">${hand}</div>
                            <div class="tt-row"><span style="color:#fca5a5;">Raise:</span> <span>${r}%</span></div>
                            <div class="tt-row"><span style="color:#6ee7b7;">Call:</span> <span>${c}%</span></div>
                            <div class="tt-row"><span style="color:#9ca3af;">Fold:</span> <span>${f}%</span></div>
                        `;
                        tooltip.style.display = 'flex';
                    };
                    cell.onmousemove = (e) => {
                        tooltip.style.left = (e.clientX + 15) + 'px';
                        tooltip.style.top = (e.clientY + 15) + 'px';
                    };
                    cell.onmouseleave = () => {
                        tooltip.style.display = 'none';
                    };

                    matrix.appendChild(cell);
                }
            }
        }

        // 启动应用
        init();
    </script>
</body>
</html>
