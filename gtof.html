<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GTO Range Viewer - 产品级稳定版</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* 自检探针样式 */
        #diagnostic-panel { background: #ef4444; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 600px; text-align: center; font-weight: bold; }
        
        .panel { background: #151b2b; border: 1px solid #2a3441; border-radius: 8px; padding: 20px; margin-bottom: 20px; width: 100%; max-width: 600px; box-sizing: border-box; }
        .flex-center { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        
        button { background: #1e293b; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.active { background: #3b82f6; color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; background: #2a3441; border: 1px solid #2a3441; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 1px #000; cursor: pointer; position: relative; }
        .cell:hover { outline: 2px solid #fff; z-index: 2; }
        
        .legend { display: flex; justify-content: center; gap: 15px; font-size: 12px; margin-top: 10px; }
        .dot { width: 12px; height: 12px; display: inline-block; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
        
        /* 悬浮窗简化，放弃复杂计算，保证绝对稳定 */
        #tooltip { position: fixed; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; font-size: 13px; display: none; pointer-events: none; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- 产品自检探针：如果JS没运行，用户会看到这个红框 -->
    <div id="diagnostic-panel">状态：正在加载... 如果你一直看到这条红色提示，说明浏览器拦截了代码执行！</div>

    <!-- 核心UI结构 -->
    <div class="panel" id="ui-container" style="display: none;">
        <div class="flex-center" id="type-btns">
            <button class="active" onclick="switchType('6max')">6人桌</button>
            <button onclick="switchType('9max')">9人桌</button>
        </div>
        <div class="flex-center" id="pos-btns"></div>
        <div class="legend">
            <span><span class="dot" style="background:#ef4444"></span>加注</span>
            <span><span class="dot" style="background:#10b981"></span>跟注</span>
            <span><span class="dot" style="background:#1f2937"></span>弃牌</span>
        </div>
    </div>

    <div class="panel" style="padding: 0; overflow: hidden; display: none;" id="grid-container">
        <div class="grid" id="matrix"></div>
    </div>
    
    <div id="tooltip"></div>

    <script>
        // 探针一：JS引擎存活确认
        document.getElementById('diagnostic-panel').style.display = 'none';
        document.getElementById('ui-container').style.display = 'block';
        document.getElementById('grid-container').style.display = 'block';

        const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        let curType = '6max';
        let curPos = 'UTG';
        
        const config = {
            '6max': ['UTG', 'HJ', 'CO', 'BTN', 'SB'],
            '9max': ['UTG', 'UTG+1', 'UTG+2', 'LJ', 'HJ', 'CO', 'BTN', 'SB']
        };

        // 数据源结构简化，降低解析失败风险
        const db = {
            '6max': {
                'UTG': { 'AA':{r:100}, 'KK':{r:100}, 'QQ':{r:100}, '77':{r:50,c:50}, 'AKs':{r:100}, 'A5s':{r:50,c:50}, 'AKo':{r:100} },
                'BTN': { 'AA':{r:100}, '22':{r:100}, 'K2s':{r:50,c:50}, 'T9o':{r:100} }
            },
            '9max': {
                'UTG': { 'AA':{r:100}, 'KK':{r:100}, 'AKs':{r:100} }
            }
        };

        function switchType(type) {
            curType = type;
            const btns = document.getElementById('type-btns').getElementsByTagName('button');
            btns[0].className = type === '6max' ? 'active' : '';
            btns[1].className = type === '9max' ? 'active' : '';
            renderPositions();
            renderMatrix();
        }

        function renderPositions() {
            const container = document.getElementById('pos-btns');
            container.innerHTML = '';
            const posList = config[curType];
            
            if (!posList.includes(curPos)) curPos = posList[0];

            posList.forEach(pos => {
                const btn = document.createElement('button');
                btn.innerText = pos;
                if (pos === curPos) btn.className = 'active';
                btn.onclick = () => {
                    curPos = pos;
                    renderPositions();
                    renderMatrix();
                };
                container.appendChild(btn);
            });
        }

        function renderMatrix() {
            const matrix = document.getElementById('matrix');
            const tooltip = document.getElementById('tooltip');
            matrix.innerHTML = '';
            
            const rangeData = (db[curType] && db[curType][curPos]) ? db[curType][curPos] : {};

            for (let i = 0; i < 13; i++) {
                for (let j = 0; i < 13; j++) {
                    let hand = '';
                    if (i < j) hand = ranks[i] + ranks[j] + 's';
                    else if (i > j) hand = ranks[j] + ranks[i] + 'o';
                    else hand = ranks[i] + ranks[j];

                    const action = rangeData[hand] || {r:0, c:0};
                    const r = action.r || 0;
                    const c = action.c || 0;
                    const f = 100 - r - c;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = hand;
                    
                    // 渐变核心逻辑
                    cell.style.background = `linear-gradient(to top, #ef4444 ${r}%, #10b981 ${r}% ${r+c}%, #1f2937 ${r+c}%)`;

                    cell.onmouseenter = () => {
                        tooltip.innerHTML = `${hand}<br><span style="color:#fca5a5">加注: ${r}%</span><br><span style="color:#6ee7b7">跟注: ${c}%</span><br><span style="color:#9ca3af">弃牌: ${f}%</span>`;
                        tooltip.style.display = 'block';
                    };
                    cell.onmousemove = (e) => {
                        tooltip.style.left = (e.clientX + 15) + 'px';
                        tooltip.style.top = (e.clientY + 15) + 'px';
                    };
                    cell.onmouseleave = () => tooltip.style.display = 'none';

                    matrix.appendChild(cell);
                }
            }
        }

        // 探针二：主函数立即执行
        renderPositions();
        renderMatrix();
    </script>
</body>
</html>
