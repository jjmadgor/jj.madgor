<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJ 投资 - 专业交易终端</title>
  <style>
    :root {
      --bg-color: #F5F5F7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --apple-blue: #0071E3;
      --apple-green: #34C759;
      --apple-red: #FF3B30;
      --border-color: rgba(0, 0, 0, 0.08);
      --panel-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    
    /* 顶部导航 */
    .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .brand { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .brand span { color: var(--apple-blue); }

    /* 用户/视图切换器 */
    .user-selector {
      display: flex; background: rgba(0, 0, 0, 0.06); padding: 4px; border-radius: 10px;
      width: 320px;
    }
    .user-tab {
      flex: 1; text-align: center; padding: 8px 0; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .user-tab.active { background: #FFFFFF; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    /* 数据概览面板 */
    .dashboard {
      background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 16px; padding: 32px; margin-bottom: 24px;
      box-shadow: var(--panel-shadow); border: 1px solid rgba(255,255,255,0.5);
      display: flex; justify-content: space-between; align-items: center;
    }
    .account-info h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .account-info p { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
    .balance-display { font-size: 36px; font-weight: 700; font-family: "SF Pro Display", sans-serif; margin-bottom: 4px; }
    
    .profit-positive { color: var(--apple-green); }
    .profit-negative { color: var(--apple-red); }
    
    .btn {
      background: var(--apple-blue); color: white; border: none; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: #0077ED; }
    .btn:disabled { background: #E5E5EA; color: #86868B; cursor: not-allowed; }

    /* 主体两栏布局 (行情 + 交易) */
    .main-content { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
    .panel-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.3px; display: flex; justify-content: space-between; align-items: center; }

    /* 行情中心 */
    .market-section { background: #FFFFFF; border-radius: 16px; padding: 20px; box-shadow: var(--panel-shadow); }
    .market-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .m-tab {
      padding: 4px 12px; border-radius: 6px; background: var(--bg-color); font-size: 12px; font-weight: 600;
      color: var(--text-muted); cursor: pointer; transition: 0.2s;
    }
    .m-tab.active { background: #1D1D1F; color: #FFF; }
    .search-box {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-color); font-size: 14px; margin-bottom: 16px; outline: none; transition: 0.2s;
    }
    .search-box:focus { border-color: var(--apple-blue); background: #FFF; }

    .stock-list { height: 500px; overflow-y: auto; padding-right: 4px; }
    .stock-list::-webkit-scrollbar { width: 4px; }
    .stock-list::-webkit-scrollbar-thumb { background: #D1D1D6; border-radius: 4px; }

    .stock-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 10px; border-bottom: 1px solid var(--border-color);
      cursor: pointer; transition: background 0.2s; border-radius: 8px;
    }
    .stock-row:hover { background: var(--bg-color); }
    .stock-row.selected { background: rgba(0, 113, 227, 0.08); border-color: transparent; }
    .stock-row .symbol { font-size: 14px; font-weight: 700; }
    .stock-row .market-tag { font-size: 10px; padding: 2px 4px; border-radius: 4px; background: #E5E5EA; margin-left: 4px; }
    .stock-row .company { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .stock-row .price { font-size: 15px; font-weight: 600; font-family: "SF Pro Display"; }

    /* 交易终端与持仓 */
    .right-section { display: flex; flex-direction: column; gap: 24px; }
    
    .trading-desk {
      background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: var(--panel-shadow);
      border: 1px solid var(--border-color);
    }
    .trade-input-group { display: flex; gap: 16px; margin-bottom: 20px; align-items: stretch; }
    .custom-symbol-input {
      flex: 1; font-size: 20px; font-weight: 700; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);
      text-transform: uppercase; outline: none; transition: 0.2s; background: var(--bg-color);
    }
    .custom-symbol-input:focus { border-color: var(--apple-blue); background: #FFF; }
    
    .quote-display { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; background: var(--bg-color); padding: 0 16px; border-radius: 8px; }
    .quote-price { font-size: 24px; font-weight: 700; color: #1D1D1F; font-family: "SF Pro Display"; }
    .quote-name { font-size: 12px; color: var(--text-muted); }
    
    .trade-actions { display: flex; gap: 12px; align-items: center; background: rgba(0, 113, 227, 0.05); padding: 16px; border-radius: 8px; }
    .trade-actions input {
      width: 100px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 16px; text-align: center; outline: none;
    }
    .est-cost { flex: 1; font-size: 13px; color: var(--text-muted); text-align: right; padding-right: 12px; }
    .est-cost span { font-weight: 600; color: #1D1D1F; }

    .portfolio-list { background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: var(--panel-shadow); flex: 1; }
    .table-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; font-size: 12px; color: var(--text-muted); padding-bottom: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
    .portfolio-item { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; align-items: center; padding: 12px 0; border-bottom: 1px solid #F2F2F7; font-size: 14px; }
    .portfolio-item:last-child { border-bottom: none; }
    
    .sell-controls { display: flex; justify-content: flex-end; gap: 6px; }
    .sell-controls input { width: 50px; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; text-align: center; font-size: 13px; }
    .sell-controls button { background: var(--bg-color); color: var(--apple-red); border: 1px solid rgba(255, 59, 48, 0.3); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .sell-controls button:hover { background: var(--apple-red); color: #FFF; }

    /* 综合总览特有样式 */
    .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .overview-card { background: #FFF; border-radius: 16px; padding: 24px; box-shadow: var(--panel-shadow); }

    @media (max-width: 900px) {
      .main-content { grid-template-columns: 1fr; }
      .dashboard { flex-direction: column; text-align: center; gap: 20px; }
      .overview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-header">
      <div class="brand">JJ <span>投资</span></div>
      <div class="user-selector" id="user-selector">
        <div class="user-tab" onclick="switchView('总览')">资产总览</div>
        <div class="user-tab active" onclick="switchView('阿桂')">阿桂 账户</div>
        <div class="user-tab" onclick="switchView('UMI')">UMI 账户</div>
      </div>
    </div>

    <!-- 个人账户视图 -->
    <div id="individual-view">
      <div class="dashboard">
        <div class="account-info">
          <h1><span id="current-user-name">阿桂</span> 的交易账户</h1>
          <p>账户本金: $1000.00 (美元结算) | 已成功提现至现实: $<span id="total-withdrawn">0.00</span></p>
          <div class="balance-display" id="total-value">$1000.00</div>
          <p style="font-size: 14px; font-weight: 600;">可用现金 (购买力): $<span id="cash-balance" style="color: var(--apple-blue);">1000.00</span></p>
        </div>
        <div style="text-align: right; min-width: 200px;">
          <p style="font-size: 13px; margin-bottom: 4px; color: var(--text-muted);">账面净收益 (含股票浮盈)</p>
          <h2 id="realtime-profit" class="profit-positive" style="margin-bottom: 8px; font-size: 28px;">+$0.00</h2>
          <button class="btn" id="withdraw-btn" onclick="withdrawProfit()">提现利润至现实账户</button>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">(若资金在股票中，需先卖出兑换为现金)</div>
        </div>
      </div>

      <div class="main-content">
        <!-- 左侧：行情中心 -->
        <div class="market-section">
          <div class="panel-title">全球行情中心</div>
          <div class="market-tabs">
            <div class="m-tab active" onclick="switchMarketCategory('ALL')">全部</div>
            <div class="m-tab" onclick="switchMarketCategory('US')">美股 ($)</div>
            <div class="m-tab" onclick="switchMarketCategory('HK')">港股 (HK$)</div>
            <div class="m-tab" onclick="switchMarketCategory('CN')">A股 (¥)</div>
          </div>
          <input type="text" class="search-box" id="search-input" placeholder="输入代码、拼音或公司名..." onkeyup="filterStocks()">
          <div class="stock-list" id="stock-list"></div>
        </div>

        <!-- 右侧：交易与持仓 -->
        <div class="right-section">
          <div class="trading-desk">
            <div class="panel-title">专业交易终端 <span>(本币报价，美元结算)</span></div>
            <div class="trade-input-group">
              <input type="text" id="desk-symbol-input" class="custom-symbol-input" placeholder="输入代码 (如 NVDA, 0700.HK, 600519)" oninput="handleManualInput()">
              <div class="quote-display">
                <div class="quote-price" id="desk-price">--</div>
                <div class="quote-name" id="desk-company">等待输入...</div>
              </div>
            </div>
            <div class="trade-actions">
              <input type="number" id="trade-qty" min="1" value="1" placeholder="数量" oninput="calculateEstCost()">
              <div class="est-cost" id="est-cost-display">折合消耗美元: <span>$0.00</span></div>
              <button class="btn" onclick="executeBuy()">确认买入</button>
            </div>
          </div>

          <div class="portfolio-list">
            <div class="panel-title">持仓明细 (卖出将转为现金购买力)</div>
            <div class="table-header">
              <div>标的</div>
              <div style="text-align: right;">当前价</div>
              <div style="text-align: right;">浮动盈亏</div>
              <div style="text-align: right; padding-right: 4px;">操作</div>
            </div>
            <div id="portfolio-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 综合总览视图 -->
    <div id="overview-view" style="display: none;">
      <div class="dashboard" style="justify-content: center; text-align: center; flex-direction: column;">
        <h2 style="margin-bottom: 8px; font-size: 20px; color: var(--text-muted);">家庭总资产 (美元)</h2>
        <div class="balance-display" id="global-total-assets" style="font-size: 48px;">$2000.00</div>
        <p style="font-size: 14px; margin-top: 8px; font-weight: 600;">家庭总利润: <span id="global-total-profit">+$0.00</span></p>
      </div>
      <div class="overview-grid">
        <div class="overview-card" id="overview-agui"></div>
        <div class="overview-card" id="overview-umi"></div>
      </div>
    </div>
  </div>

  <script>
    // 系统核心配置
    const USERS = ['阿桂', 'UMI'];
    const CURRENCIES = { US: '$', HK: 'HK$', CN: '¥' };
    const FX_RATES = { US: 1.0, HK: 7.8, CN: 7.2 }; // 1美元折合多少本币
    
    // 三大市场基础证券库
    const GLOBAL_STOCKS = [
      { symbol: 'AAPL', name: '苹果公司', market: 'US', basePrice: 173.50 },
      { symbol: 'MSFT', name: '微软', market: 'US', basePrice: 406.20 },
      { symbol: 'NVDA', name: '英伟达', market: 'US', basePrice: 881.50 },
      { symbol: 'TSLA', name: '特斯拉', market: 'US', basePrice: 195.80 },
      { symbol: 'BRK.B', name: '伯克希尔', market: 'US', basePrice: 408.10 },
      { symbol: 'JPM', name: '摩根大通', market: 'US', basePrice: 191.40 },
      { symbol: '0700.HK', name: '腾讯控股', market: 'HK', basePrice: 388.50 },
      { symbol: '9988.HK', name: '阿里巴巴', market: 'HK', basePrice: 72.20 },
      { symbol: '3690.HK', name: '美团', market: 'HK', basePrice: 115.60 },
      { symbol: '1810.HK', name: '小米集团', market: 'HK', basePrice: 18.30 },
      { symbol: '600519', name: '贵州茅台', market: 'CN', basePrice: 1630.00 },
      { symbol: '300750', name: '宁德时代', market: 'CN', basePrice: 196.50 },
      { symbol: '002594', name: '比亚迪 (A股)', market: 'CN', basePrice: 232.40 },
      { symbol: '601398', name: '工商银行', market: 'CN', basePrice: 5.40 },
      { symbol: '601318', name: '中国平安', market: 'CN', basePrice: 46.20 }
    ];

    let currentPrices = {};
    let activeView = '阿桂'; // 默认视图
    let selectedStockSymbol = ''; 
    let currentMarketTab = 'ALL';

    // 数据初始化 (升级了DB名称，强制重置旧数据)
    let accounts = JSON.parse(localStorage.getItem('jj_invest_db_v1'));
    if (!accounts) {
      accounts = {};
      USERS.forEach(user => { accounts[user] = { cash: 1000.00, withdrawn: 0.00, portfolio: {} }; });
    }

    function initSystem() {
      GLOBAL_STOCKS.forEach(stock => {
        if (!currentPrices[stock.symbol]) currentPrices[stock.symbol] = stock.basePrice;
      });
      // 加载自定义股票的历史价格
      for (const u in accounts) {
        for (const sym in accounts[u].portfolio) {
          if (!currentPrices[sym]) currentPrices[sym] = generateMockPrice(sym);
        }
      }
      renderMarketList();
      switchView('阿桂');
    }

    function generateMockPrice(symbol) {
      let hash = 0;
      for (let i = 0; i < symbol.length; i++) hash += symbol.charCodeAt(i);
      return (hash % 200) + 15; 
    }

    // 智能解析市场与代码
    function parseSymbolInfo(raw) {
      let s = raw.toUpperCase().trim();
      if (/^\d{4}$/.test(s)) return { symbol: `${s}.HK`, market: 'HK' };
      if (/^\d{6}$/.test(s)) return { symbol: s, market: 'CN' };
      if (s.includes('.HK')) return { symbol: s, market: 'HK' };
      if (s.includes('.SS') || s.includes('.SZ')) return { symbol: s, market: 'CN' };
      return { symbol: s, market: 'US' };
    }

    // 视图切换 (总览 vs 个人)
    function switchView(viewName) {
      activeView = viewName;
      document.querySelectorAll('.user-tab').forEach(tab => {
        tab.classList.toggle('active', tab.innerText.includes(viewName));
      });

      if (viewName === '总览') {
        document.getElementById('individual-view').style.display = 'none';
        document.getElementById('overview-view').style.display = 'block';
        renderOverview();
      } else {
        document.getElementById('overview-view').style.display = 'none';
        document.getElementById('individual-view').style.display = 'block';
        document.getElementById('current-user-name').innerText = viewName;
        renderPortfolio();
      }
    }

    function renderMarketList() {
      const listEl = document.getElementById('stock-list');
      let html = '';
      GLOBAL_STOCKS.forEach(stock => {
        const isSelected = selectedStockSymbol === stock.symbol ? 'selected' : '';
        const curSym = CURRENCIES[stock.market];
        html += `
          <div class="stock-row ${isSelected}" id="row-${stock.symbol}" onclick="selectStock('${stock.symbol}')">
            <div>
              <div class="symbol">${stock.symbol} <span class="market-tag">${stock.market}</span></div>
              <div class="company">${stock.name}</div>
            </div>
            <div class="price" id="price-${stock.symbol}">${curSym}${(currentPrices[stock.symbol] || stock.basePrice).toFixed(2)}</div>
          </div>
        `;
      });
      listEl.innerHTML = html;
      filterStocks();
    }

    function switchMarketCategory(category) {
      currentMarketTab = category;
      document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      filterStocks();
    }

    function filterStocks() {
      const query = document.getElementById('search-input').value.toLowerCase();
      GLOBAL_STOCKS.forEach(stock => {
        const row = document.getElementById(`row-${stock.symbol}`);
        if (!row) return;
        const matchCategory = currentMarketTab === 'ALL' || stock.market === currentMarketTab;
        const matchSearch = stock.symbol.toLowerCase().includes(query) || stock.name.toLowerCase().includes(query) || stock.symbol.includes(query);
        row.style.display = (matchCategory && matchSearch) ? 'flex' : 'none';
      });
    }

    function selectStock(symbol) {
      selectedStockSymbol = symbol;
      const stock = GLOBAL_STOCKS.find(s => s.symbol === symbol) || { name: '自选股票', market: parseSymbolInfo(symbol).market };
      
      document.querySelectorAll('.stock-row').forEach(row => row.classList.remove('selected'));
      const activeRow = document.getElementById(`row-${symbol}`);
      if (activeRow) activeRow.classList.add('selected');

      document.getElementById('desk-symbol-input').value = symbol;
      document.getElementById('desk-company').innerText = `${stock.name} (${stock.market})`;
      document.getElementById('desk-price').innerText = `${CURRENCIES[stock.market]}${currentPrices[symbol].toFixed(2)}`;
      calculateEstCost();
    }

    function handleManualInput() {
      const rawInput = document.getElementById('desk-symbol-input').value;
      if (!rawInput.trim()) {
        selectedStockSymbol = '';
        document.getElementById('desk-company').innerText = '等待输入...';
        document.getElementById('desk-price').innerText = '--';
        document.getElementById('est-cost-display').innerHTML = `折合消耗美元: <span>$0.00</span>`;
        return;
      }

      const parsed = parseSymbolInfo(rawInput);
      selectedStockSymbol = parsed.symbol;
      
      const found = GLOBAL_STOCKS.find(s => s.symbol === selectedStockSymbol || s.symbol.startsWith(rawInput.toUpperCase()));
      if (found) {
        selectStock(found.symbol);
      } else {
        if (!currentPrices[selectedStockSymbol]) currentPrices[selectedStockSymbol] = generateMockPrice(selectedStockSymbol);
        document.getElementById('desk-company').innerText = `自选证券 (${parsed.market})`;
        document.getElementById('desk-price').innerText = `${CURRENCIES[parsed.market]}${currentPrices[selectedStockSymbol].toFixed(2)}`;
        calculateEstCost();
      }
    }

    function calculateEstCost() {
      if (!selectedStockSymbol) return;
      const shares = parseInt(document.getElementById('trade-qty').value) || 0;
      const market = parseSymbolInfo(selectedStockSymbol).market;
      const localPrice = currentPrices[selectedStockSymbol];
      // 将本币按汇率折算为美元成本
      const usdCost = (shares * localPrice) / FX_RATES[market];
      document.getElementById('est-cost-display').innerHTML = `折合消耗美元: <span>$${usdCost.toFixed(2)}</span>`;
    }

    // 买入：本币计价，消耗美元
    function executeBuy() {
      if (!selectedStockSymbol) return alert('请先选择或输入交易标的！');
      const shares = parseInt(document.getElementById('trade-qty').value);
      if (isNaN(shares) || shares <= 0) return alert('数量无效！');

      const market = parseSymbolInfo(selectedStockSymbol).market;
      const localPrice = currentPrices[selectedStockSymbol];
      const usdCost = (shares * localPrice) / FX_RATES[market];
      const account = accounts[activeView];

      if (account.cash < usdCost) {
        return alert(`⚠️ 购买力不足！\n标的单价: ${CURRENCIES[market]}${localPrice.toFixed(2)}\n折合美元消耗: $${usdCost.toFixed(2)}\n当前可用: $${account.cash.toFixed(2)}`);
      }

      account.cash -= usdCost;
      if (!account.portfolio[selectedStockSymbol]) {
        account.portfolio[selectedStockSymbol] = { shares: 0, costUSD: 0, market: market };
      }
      account.portfolio[selectedStockSymbol].shares += shares;
      account.portfolio[selectedStockSymbol].costUSD += usdCost;
      
      saveData();
      renderPortfolio();
      
      const btn = document.querySelector('.trade-actions button');
      btn.innerText = '买入成功'; btn.style.background = 'var(--apple-green)';
      setTimeout(() => { btn.innerText = '确认买入'; btn.style.background = 'var(--apple-blue)'; }, 1000);
    }

    // 卖出：释放出美元购买力
    function sellStock(symbol) {
      const sharesToSell = parseInt(document.getElementById(`sell-qty-${symbol}`).value);
      const account = accounts[activeView];
      const stockData = account.portfolio[symbol];

      if (isNaN(sharesToSell) || sharesToSell <= 0) return alert('数量无效！');
      if (sharesToSell > stockData.shares) return alert(`⚠️ 卖出数不能超过持仓 (${stockData.shares} 股)！`);

      const localPrice = currentPrices[symbol];
      // 卖出得到的本币，按汇率折算为美元回到账户
      const usdRevenue = (sharesToSell * localPrice) / FX_RATES[stockData.market];
      const costPerShareUSD = stockData.costUSD / stockData.shares;

      stockData.shares -= sharesToSell;
      stockData.costUSD -= (costPerShareUSD * sharesToSell);
      account.cash += usdRevenue;

      if (stockData.shares === 0) delete account.portfolio[symbol];

      saveData();
      renderPortfolio();
    }

    // 核心价格引擎
    function tickPrices() {
      Object.keys(currentPrices).forEach(symbol => {
        const base = currentPrices[symbol];
        const volatility = base * 0.002; 
        const delta = (Math.random() - 0.49) * volatility;
        currentPrices[symbol] = Math.max(0.01, base + delta);
        
        const el = document.getElementById(`price-${symbol}`);
        const market = parseSymbolInfo(symbol).market;
        if(el) el.innerText = `${CURRENCIES[market]}${currentPrices[symbol].toFixed(2)}`;
      });

      if (selectedStockSymbol && currentPrices[selectedStockSymbol]) {
        const market = parseSymbolInfo(selectedStockSymbol).market;
        document.getElementById('desk-price').innerText = `${CURRENCIES[market]}${currentPrices[selectedStockSymbol].toFixed(2)}`;
        calculateEstCost();
      }

      if (activeView === '总览') renderOverview();
      else renderPortfolio(); 
    }

    function renderPortfolio() {
      const account = accounts[activeView];
      let stockValueUSD = 0;
      let html = '';
      
      for (const [symbol, data] of Object.entries(account.portfolio)) {
        if (data.shares > 0) {
          const localPrice = currentPrices[symbol] || 0;
          const currentValUSD = (data.shares * localPrice) / FX_RATES[data.market];
          const profitUSD = currentValUSD - data.costUSD;
          const profitClass = profitUSD >= 0 ? 'profit-positive' : 'profit-negative';
          const curSym = CURRENCIES[data.market];
          
          stockValueUSD += currentValUSD;
          
          html += `
            <div class="portfolio-item">
              <div>
                <div style="font-weight: 700; font-size: 15px;">${symbol}</div>
                <div style="font-size: 11px; color: var(--text-muted);">${data.shares} 股 | 成本 $${data.costUSD.toFixed(2)}</div>
              </div>
              <div style="text-align: right; font-weight: 600;">${curSym}${localPrice.toFixed(2)}</div>
              <div style="text-align: right; font-weight: 600;" class="${profitClass}">${profitUSD >= 0 ? '+' : ''}$${profitUSD.toFixed(2)}</div>
              <div class="sell-controls">
                <input type="number" id="sell-qty-${symbol}" min="1" max="${data.shares}" value="${data.shares}">
                <button onclick="sellStock('${symbol}')">卖出</button>
              </div>
            </div>
          `;
        }
      }

      document.getElementById('portfolio-list').innerHTML = html || `<p style="color: var(--text-muted); text-align: center; padding: 30px;">暂无持仓数据</p>`;

      const totalAssets = account.cash + stockValueUSD;
      const netProfit = (totalAssets + account.withdrawn) - 1000.00;

      document.getElementById('total-value').innerText = `$${totalAssets.toFixed(2)}`;
      document.getElementById('cash-balance').innerText = account.cash.toFixed(2);
      document.getElementById('total-withdrawn').innerText = account.withdrawn.toFixed(2);
      
      const profitEl = document.getElementById('realtime-profit');
      profitEl.innerText = `${netProfit >= 0 ? '+' : ''}$${netProfit.toFixed(2)}`;
      profitEl.className = netProfit >= 0 ? 'profit-positive' : 'profit-negative';
      
      const withdrawBtn = document.getElementById('withdraw-btn');
      if (netProfit > 0.01 && account.cash >= netProfit) {
        withdrawBtn.disabled = false;
        withdrawBtn.innerText = `提现利润至现实 ($${netProfit.toFixed(2)})`;
      } else {
        withdrawBtn.disabled = true;
        withdrawBtn.innerText = '暂无可提现金额';
      }
    }

    // 提现逻辑 (仅扣除现金和利润，不影响本金)
    function withdrawProfit() {
      const account = accounts[activeView];
      let stockVal = 0;
      for (const [sym, d] of Object.entries(account.portfolio)) {
        if (d.shares > 0) stockVal += (d.shares * currentPrices[sym]) / FX_RATES[d.market];
      }
      const netProfit = (account.cash + stockVal + account.withdrawn) - 1000.00;

      if (netProfit > 0 && account.cash >= netProfit) {
        account.cash -= netProfit;
        account.withdrawn += netProfit;
        alert(`🎉 成功结算！\n${activeView} 已成功将 $${netProfit.toFixed(2)} 利润提现至现实账户！\n系统内仍保留 $1000 基础运转本金。`);
        saveData();
        renderPortfolio();
      }
    }

    // 渲染总览面板
    function renderOverview() {
      let globalAssets = 0;
      let globalProfit = 0;

      USERS.forEach(user => {
        const acc = accounts[user];
        let stockVal = 0;
        for (const [sym, d] of Object.entries(acc.portfolio)) {
          if (d.shares > 0) stockVal += (d.shares * currentPrices[sym]) / FX_RATES[d.market];
        }
        const totalAsst = acc.cash + stockVal;
        const profit = (totalAsst + acc.withdrawn) - 1000.00;
        
        globalAssets += totalAsst;
        globalProfit += profit;

        const el = document.getElementById(`overview-${user === '阿桂' ? 'agui' : 'umi'}`);
        if(el) {
          el.innerHTML = `
            <div style="font-size: 20px; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid #EEE; padding-bottom: 12px;">${user} 的资金盘口</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="color: var(--text-muted);">总资产估值</span>
              <span style="font-weight: 600;">$${totalAsst.toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="color: var(--text-muted);">资金利用率 (持仓占比)</span>
              <span style="font-weight: 600;">${((stockVal / totalAsst) * 100).toFixed(1)}%</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="color: var(--text-muted);">已提现金额</span>
              <span style="font-weight: 600;">$${acc.withdrawn.toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #EEE;">
              <span style="color: var(--text-muted);">净收益表现</span>
              <span style="font-weight: 700; font-size: 18px;" class="${profit >= 0 ? 'profit-positive' : 'profit-negative'}">
                ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}
              </span>
            </div>
          `;
        }
      });

      document.getElementById('global-total-assets').innerText = `$${globalAssets.toFixed(2)}`;
      const pEl = document.getElementById('global-total-profit');
      pEl.innerText = `${globalProfit >= 0 ? '+' : ''}$${globalProfit.toFixed(2)}`;
      pEl.className = globalProfit >= 0 ? 'profit-positive' : 'profit-negative';
    }

    function saveData() { localStorage.setItem('jj_invest_db_v1', JSON.stringify(accounts)); }

    initSystem();
    setInterval(tickPrices, 3000);
  </script>
</body>
</html>
