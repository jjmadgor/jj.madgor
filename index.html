<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭模拟投资联赛</title>
  <style>
    :root {
      --bg-color: #F5F5F7;
      --card-bg: rgba(255, 255, 255, 0.7);
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --apple-blue: #0071E3;
      --apple-green: #34C759;
      --apple-red: #FF3B30;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 用户切换器 (iOS 风格分段控制器) */
    .user-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .user-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .user-tab.active {
      background: #FFFFFF;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* 顶部账户概览 */
    .dashboard {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .account-info h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .account-info p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .balance-display {
      font-size: 40px;
      font-weight: 700;
      font-family: "SF Pro Display", sans-serif;
      margin-bottom: 4px;
    }

    .profit-positive { color: var(--apple-green); }
    .profit-negative { color: var(--apple-red); }

    .btn {
      background: var(--apple-blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn:hover { background: #0077ED; transform: scale(1.02); }
    .btn:disabled { background: #E5E5EA; color: #86868B; cursor: not-allowed; transform: none; }

    /* 市场与持仓区域 */
    h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s;
    }

    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .symbol { font-size: 18px; font-weight: 700; }
    .company { font-size: 12px; color: var(--text-muted); }
    .price { font-size: 24px; font-weight: 600; font-family: "SF Pro Display"; }
    
    .buy-controls {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .buy-controls input {
      width: 60px;
      border: 1px solid #D1D1D6;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .buy-controls button {
      flex: 1;
      background: #F2F2F7;
      color: var(--apple-blue);
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .buy-controls button:hover { background: #E5E5EA; }

    /* 持仓列表 */
    .portfolio-list {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    .portfolio-item {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #F2F2F7;
    }
    .portfolio-item:last-child { border-bottom: none; }

    @media (max-width: 600px) {
      .dashboard { flex-direction: column; text-align: center; gap: 20px; }
      .account-info h1 { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 四人账户切换器 -->
    <div class="user-selector" id="user-selector">
      <div class="user-tab" onclick="switchUser('阿桂')">阿桂</div>
      <div class="user-tab" onclick="switchUser('UMI')">UMI</div>
      <div class="user-tab" onclick="switchUser('大圣')">大圣</div>
      <div class="user-tab" onclick="switchUser('爸爸')">爸爸</div>
    </div>

    <!-- 账户面板 -->
    <div class="dashboard">
      <div class="account-info">
        <h1><span id="current-user-name">大圣</span> 的投资组合</h1>
        <p>初始资金: $1000.00 | 已提现收益: $<span id="total-withdrawn">0.00</span></p>
        <div class="balance-display" id="total-value">$1000.00</div>
        <p>可用现金: $<span id="cash-balance">1000.00</span></p>
      </div>
      <div style="text-align: right; min-width: 140px;">
        <p style="font-size: 14px; margin-bottom: 4px; color: var(--text-muted);">当前净收益</p>
        <h2 id="total-profit" class="profit-positive" style="margin-bottom: 0;">+$0.00</h2>
        <button class="btn" id="withdraw-btn" onclick="withdrawProfit()">提现收益</button>
      </div>
    </div>

    <h2>美股七支花 (Magnificent 7)</h2>
    <div class="grid" id="market-grid">
      <!-- 股票卡片由 JS 自动生成 -->
    </div>

    <h2>我的持仓</h2>
    <div class="portfolio-list" id="portfolio-list">
      <!-- 持仓列表由 JS 自动生成 -->
    </div>
  </div>

  <script>
    // 定义用户和股票基准数据
    const USERS = ['阿桂', 'UMI', '大圣', '爸爸'];
    const M7_STOCKS = [
      { symbol: 'AAPL', name: 'Apple Inc.', basePrice: 175.50 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', basePrice: 405.20 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', basePrice: 145.30 },
      { symbol: 'AMZN', name: 'Amazon.com', basePrice: 178.10 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', basePrice: 880.50 },
      { symbol: 'META', name: 'Meta Platforms', basePrice: 490.00 },
      { symbol: 'TSLA', name: 'Tesla Inc.', basePrice: 195.80 }
    ];

    let currentPrices = {};
    let currentUser = '大圣'; // 默认进入页面显示大圣的账户
    
    // 初始化所有人的账户数据
    let accounts = JSON.parse(localStorage.getItem('family_stock_accounts'));
    if (!accounts) {
      accounts = {};
      USERS.forEach(user => {
        accounts[user] = {
          cash: 1000.00,
          withdrawn: 0.00,
          portfolio: {}
        };
      });
    }

    // 切换用户
    function switchUser(userName) {
      currentUser = userName;
      
      // 更新 UI 选中状态
      const tabs = document.querySelectorAll('.user-tab');
      tabs.forEach(tab => {
        if (tab.innerText === userName) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      document.getElementById('current-user-name').innerText = userName;
      renderPortfolio();
    }

    // 模拟股票价格随机波动
    function updatePrices() {
      M7_STOCKS.forEach(stock => {
        const volatility = stock.basePrice * 0.002; 
        const change = (Math.random() - 0.5) * volatility;
        currentPrices[stock.symbol] = currentPrices[stock.symbol] 
          ? Math.max(1, currentPrices[stock.symbol] + change) 
          : stock.basePrice;
      });
      renderMarket();
      renderPortfolio(); // 价格变动时，实时更新持仓市值
    }

    // 渲染市场卡片
    function renderMarket() {
      const grid = document.getElementById('market-grid');
      grid.innerHTML = M7_STOCKS.map(stock => {
        const price = currentPrices[stock.symbol].toFixed(2);
        return `
          <div class="card">
            <div class="stock-header">
              <div>
                <div class="symbol">${stock.symbol}</div>
                <div class="company">${stock.name}</div>
              </div>
              <div class="price">$${price}</div>
            </div>
            <div class="buy-controls">
              <input type="number" id="qty-${stock.symbol}" min="1" value="1">
              <button onclick="buyStock('${stock.symbol}')">买入</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 买入逻辑 (记录到当前选中的用户账户)
    function buyStock(symbol) {
      const qtyInput = document.getElementById(`qty-${symbol}`);
      const shares = parseInt(qtyInput.value);
      const price = currentPrices[symbol];
      const totalCost = shares * price;
      const userAccount = accounts[currentUser];

      if (shares <= 0 || isNaN(shares)) return alert('请输入正确的数量');
      if (userAccount.cash < totalCost) return alert(`⚠️ ${currentUser} 的现金不足，无法买入！`);

      // 扣除现金并增加持仓
      userAccount.cash -= totalCost;
      if (!userAccount.portfolio[symbol]) {
        userAccount.portfolio[symbol] = { shares: 0, cost: 0 };
      }
      userAccount.portfolio[symbol].shares += shares;
      userAccount.portfolio[symbol].cost += totalCost;
      
      saveData();
      renderPortfolio();
    }

    // 渲染持仓与账户总览
    function renderPortfolio() {
      const userAccount = accounts[currentUser];
      let stockValue = 0;
      let portfolioHTML = '';
      
      for (const [symbol, data] of Object.entries(userAccount.portfolio)) {
        if (data.shares > 0) {
          const currentPrice = currentPrices[symbol];
          const currentValue = data.shares * currentPrice;
          const profit = currentValue - data.cost;
          const profitClass = profit >= 0 ? 'profit-positive' : 'profit-negative';
          const sign = profit >= 0 ? '+' : '';
          
          stockValue += currentValue;
          
          portfolioHTML += `
            <div class="portfolio-item">
              <div>
                <div style="font-weight: 600;">${symbol}</div>
                <div style="font-size: 13px; color: #86868B;">${data.shares} 股 | 总成本 $${data.cost.toFixed(2)}</div>
              </div>
              <div style="text-align: right;">
                <div style="font-weight: 600;">$${currentValue.toFixed(2)}</div>
                <div class="${profitClass}" style="font-size: 13px;">${sign}$${profit.toFixed(2)}</div>
              </div>
            </div>
          `;
        }
      }

      if (portfolioHTML === '') {
        portfolioHTML = `<p style="color: #86868B; text-align: center; padding: 20px;">${currentUser} 暂无持仓，快去抄底吧！</p>`;
      }
      document.getElementById('portfolio-list').innerHTML = portfolioHTML;

      // 更新总资产与收益
      const totalAssets = userAccount.cash + stockValue;
      const totalProfit = totalAssets + userAccount.withdrawn - 1000.00; 

      document.getElementById('total-value').innerText = `$${totalAssets.toFixed(2)}`;
      document.getElementById('cash-balance').innerText = userAccount.cash.toFixed(2);
      document.getElementById('total-withdrawn').innerText = userAccount.withdrawn.toFixed(2);
      
      const profitEl = document.getElementById('total-profit');
      profitEl.innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;
      profitEl.className = totalProfit >= 0 ? 'profit-positive' : 'profit-negative';

      // 提现按钮逻辑
      const withdrawBtn = document.getElementById('withdraw-btn');
      if (totalProfit > 0 && userAccount.cash >= totalProfit) {
        withdrawBtn.disabled = false;
        withdrawBtn.innerText = `提现收益 ($${totalProfit.toFixed(2)})`;
      } else {
        withdrawBtn.disabled = true;
        withdrawBtn.innerText = userAccount.cash < totalProfit ? '需卖出股票以提现' : '暂无收益可提现';
      }
    }

    // 提现逻辑
    function withdrawProfit() {
      const userAccount = accounts[currentUser];
      
      // 重新计算总资产以防跳动
      let stockValue = 0;
      for (const [symbol, data] of Object.entries(userAccount.portfolio)) {
        if (data.shares > 0) stockValue += data.shares * currentPrices[symbol];
      }
      const totalAssets = userAccount.cash + stockValue;
      const totalProfit = totalAssets + userAccount.withdrawn - 1000.00;

      if (totalProfit > 0 && userAccount.cash >= totalProfit) {
        userAccount.cash -= totalProfit;
        userAccount.withdrawn += totalProfit;
        alert(`🎉 恭喜 ${currentUser}！成功提现收益 $${totalProfit.toFixed(2)}！`);
        saveData();
        renderPortfolio();
      }
    }

    // 保存所有账户数据到本地
    function saveData() {
      localStorage.setItem('family_stock_accounts', JSON.stringify(accounts));
    }

    // 启动系统
    switchUser('大圣'); // 初始选中大圣
    updatePrices();
    setInterval(updatePrices, 3000); // 每 3 秒刷新一次价格

  </script>
</body>
</html>
