<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnificent 7 模拟投资系统</title>
  <style>
    :root {
      --bg-color: #F5F5F7;
      --card-bg: rgba(255, 255, 255, 0.7);
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --apple-blue: #0071E3;
      --apple-green: #34C759;
      --apple-red: #FF3B30;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 顶部账户概览 */
    .dashboard {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .account-info h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .account-info p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .balance-display {
      font-size: 40px;
      font-weight: 700;
      font-family: "SF Pro Display", sans-serif;
    }

    .profit-positive { color: var(--apple-green); }
    .profit-negative { color: var(--apple-red); }

    .btn {
      background: var(--apple-blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { background: #0077ED; transform: scale(1.02); }
    .btn:disabled { background: #E5E5EA; color: #86868B; cursor: not-allowed; transform: none; }

    /* 市场与持仓区域 */
    h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s;
    }

    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .symbol { font-size: 18px; font-weight: 700; }
    .company { font-size: 12px; color: var(--text-muted); }
    .price { font-size: 24px; font-weight: 600; font-family: "SF Pro Display"; }
    
    .buy-controls {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .buy-controls input {
      width: 60px;
      border: 1px solid #D1D1D6;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .buy-controls button {
      flex: 1;
      background: #F2F2F7;
      color: var(--apple-blue);
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .buy-controls button:hover { background: #E5E5EA; }

    /* 持仓列表 */
    .portfolio-list {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    .portfolio-item {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #F2F2F7;
    }
    .portfolio-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="dashboard">
      <div class="account-info">
        <h1>投资组合</h1>
        <p>初始资金: $1000.00 | 已提现收益: $<span id="total-withdrawn">0.00</span></p>
        <div class="balance-display" id="total-value">$1000.00</div>
        <p style="margin-top: 4px;">可用现金: $<span id="cash-balance">1000.00</span></p>
      </div>
      <div style="text-align: right;">
        <p style="font-size: 14px; margin-bottom: 8px; color: var(--text-muted);">当前净收益</p>
        <h2 id="total-profit" class="profit-positive">+$0.00</h2>
        <button class="btn" id="withdraw-btn" onclick="withdrawProfit()">提现收益</button>
      </div>
    </div>

    <h2>美股七支花 (Magnificent 7)</h2>
    <div class="grid" id="market-grid">
      <!-- 股票卡片由 JS 自动生成 -->
    </div>

    <h2>我的持仓</h2>
    <div class="portfolio-list" id="portfolio-list">
      <p style="color: #86868B; text-align: center; padding: 20px;">暂无持仓，去买入你的第一支股票吧！</p>
    </div>
  </div>

  <script>
    // 初始股票数据 (基准价)
    const M7_STOCKS = [
      { symbol: 'AAPL', name: 'Apple Inc.', basePrice: 175.50 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', basePrice: 405.20 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', basePrice: 145.30 },
      { symbol: 'AMZN', name: 'Amazon.com', basePrice: 178.10 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', basePrice: 880.50 },
      { symbol: 'META', name: 'Meta Platforms', basePrice: 490.00 },
      { symbol: 'TSLA', name: 'Tesla Inc.', basePrice: 195.80 }
    ];

    let currentPrices = {};
    
    // 初始化或从本地读取账户数据
    let account = JSON.parse(localStorage.getItem('kid_stock_account')) || {
      cash: 1000.00,
      withdrawn: 0.00,
      portfolio: {} // 格式: { AAPL: { shares: 2, cost: 350.00 } }
    };

    // 模拟股票价格随机波动
    function updatePrices() {
      M7_STOCKS.forEach(stock => {
        const volatility = stock.basePrice * 0.002; // 0.2% 波动率
        const change = (Math.random() - 0.5) * volatility;
        // 如果是首次加载，使用基准价，否则在当前价格上波动
        currentPrices[stock.symbol] = currentPrices[stock.symbol] 
          ? Math.max(1, currentPrices[stock.symbol] + change) 
          : stock.basePrice;
      });
      renderMarket();
      renderPortfolio();
    }

    // 渲染市场卡片
    function renderMarket() {
      const grid = document.getElementById('market-grid');
      grid.innerHTML = M7_STOCKS.map(stock => {
        const price = currentPrices[stock.symbol].toFixed(2);
        return `
          <div class="card">
            <div class="stock-header">
              <div>
                <div class="symbol">${stock.symbol}</div>
                <div class="company">${stock.name}</div>
              </div>
              <div class="price">$${price}</div>
            </div>
            <div class="buy-controls">
              <input type="number" id="qty-${stock.symbol}" min="1" value="1">
              <button onclick="buyStock('${stock.symbol}')">买入</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 买入逻辑
    function buyStock(symbol) {
      const qtyInput = document.getElementById(`qty-${symbol}`);
      const shares = parseInt(qtyInput.value);
      const price = currentPrices[symbol];
      const totalCost = shares * price;

      if (shares <= 0 || isNaN(shares)) return alert('请输入正确的数量');
      if (account.cash < totalCost) return alert('现金不足，无法买入！');

      account.cash -= totalCost;
      if (!account.portfolio[symbol]) {
        account.portfolio[symbol] = { shares: 0, cost: 0 };
      }
      account.portfolio[symbol].shares += shares;
      account.portfolio[symbol].cost += totalCost;
      
      saveData();
      renderPortfolio();
    }

    // 渲染持仓与账户总览
    function renderPortfolio() {
      let stockValue = 0;
      let portfolioHTML = '';
      
      for (const [symbol, data] of Object.entries(account.portfolio)) {
        if (data.shares > 0) {
          const currentPrice = currentPrices[symbol];
          const currentValue = data.shares * currentPrice;
          const profit = currentValue - data.cost;
          const profitClass = profit >= 0 ? 'profit-positive' : 'profit-negative';
          const sign = profit >= 0 ? '+' : '';
          
          stockValue += currentValue;
          
          portfolioHTML += `
            <div class="portfolio-item">
              <div>
                <div style="font-weight: 600;">${symbol}</div>
                <div style="font-size: 13px; color: #86868B;">${data.shares} 股 | 平均成本 $${(data.cost/data.shares).toFixed(2)}</div>
              </div>
              <div style="text-align: right;">
                <div style="font-weight: 600;">$${currentValue.toFixed(2)}</div>
                <div class="${profitClass}" style="font-size: 13px;">${sign}$${profit.toFixed(2)}</div>
              </div>
            </div>
          `;
        }
      }

      if (portfolioHTML === '') {
        portfolioHTML = '<p style="color: #86868B; text-align: center; padding: 20px;">暂无持仓，去买入你的第一支股票吧！</p>';
      }

      document.getElementById('portfolio-list').innerHTML = portfolioHTML;

      // 更新总资产与收益
      const totalAssets = account.cash + stockValue;
      // 净利润 = 总资产 + 已提现的钱 - 初始资金1000
      const totalProfit = totalAssets + account.withdrawn - 1000.00; 

      document.getElementById('total-value').innerText = `$${totalAssets.toFixed(2)}`;
      document.getElementById('cash-balance').innerText = account.cash.toFixed(2);
      document.getElementById('total-withdrawn').innerText = account.withdrawn.toFixed(2);
      
      const profitEl = document.getElementById('total-profit');
      profitEl.innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;
      profitEl.className = totalProfit >= 0 ? 'profit-positive' : 'profit-negative';

      // 提现按钮逻辑：只有当系统内总资产 > 当前投入本金(1000 - withdrawn)时，才允许提现
      const withdrawBtn = document.getElementById('withdraw-btn');
      if (totalProfit > 0 && account.cash >= totalProfit) {
        withdrawBtn.disabled = false;
        withdrawBtn.innerText = `提现收益 ($${totalProfit.toFixed(2)})`;
      } else {
        withdrawBtn.disabled = true;
        withdrawBtn.innerText = account.cash < totalProfit ? '需卖出股票以提现' : '暂无收益可提现';
      }
    }

    // 提现逻辑
    function withdrawProfit() {
      const totalAssets = account.cash + Object.values(account.portfolio).reduce((sum, item) => sum + (item.shares * currentPrices[Object.keys(account.portfolio).find(key => account.portfolio[key] === item)]), 0);
      const totalProfit = totalAssets + account.withdrawn - 1000.00;

      if (totalProfit > 0 && account.cash >= totalProfit) {
        account.cash -= totalProfit;
        account.withdrawn += totalProfit;
        alert(`🎉 恭喜！成功提现收益 $${totalProfit.toFixed(2)}！拿去买点好吃的吧！`);
        saveData();
        renderPortfolio();
      }
    }

    function saveData() {
      localStorage.setItem('kid_stock_account', JSON.stringify(account));
    }

    // 启动系统
    updatePrices();
    setInterval(updatePrices, 3000); // 每 3 秒刷新一次价格

  </script>
</body>
</html>
