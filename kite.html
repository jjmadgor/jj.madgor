<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiteboarding Hub | 风冲日志与风况看板</title>
    <style>
        :root {
            --bg-main: #0c121e;
            --bg-card: #152033;
            --accent-cyan: #00e5ff;
            --accent-orange: #ff9100;
            --text-primary: #e6f1ff;
            --text-muted: #8ba2c4;
            --border: #223452;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 24px;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
        }

        header span {
            font-size: 14px;
            color: var(--text-muted);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            font-size: 16px;
            color: var(--accent-orange);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 快捷风速换算 */
        .calc-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .calc-row input, .calc-row select {
            flex: 1;
            padding: 10px 12px;
            background: #0b1524;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 14px;
        }

        button.btn-action {
            background: var(--accent-cyan);
            color: #05131e;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .result-box {
            margin-top: 14px;
            background: #0b1524;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-primary);
            border-left: 3px solid var(--accent-cyan);
        }

        /* 外部风况工具直达 */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .tool-link {
            text-decoration: none;
            color: var(--text-primary);
            background: #0b1524;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        .tool-link:hover {
            border-color: var(--accent-cyan);
        }

        /* 日志记录表单与列表 */
        .log-inputs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .log-inputs {
                grid-template-columns: 1fr 1fr;
            }
        }

        .log-inputs input {
            padding: 8px 10px;
            background: #0b1524;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 12px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }

        td {
            color: var(--text-primary);
        }

        .badge {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-cyan);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ KITEBOARDING HQ</h1>
        <span>风向标 & 下水档案</span>
    </header>

    <div class="grid-2">
        <div class="card">
            <h2>风力 & 伞型建议</h2>
            <div class="calc-row">
                <input type="number" id="windKnots" placeholder="预报风速 (Knots/节)" value="18">
                <input type="number" id="riderWeight" placeholder="体重 (kg)" value="75">
            </div>
            <button class="btn-action" onclick="calculateKiteSize()">计算适配风筝与板型</button>
            <div class="result-box" id="calcOutput">
                输入风速与体重获取快速参考。
            </div>
        </div>

        <div class="card">
            <h2>常用风况平台直达</h2>
            <div class="links-grid">
                <a href="https://www.windy.com" target="_blank" class="tool-link">Windy.com</a>
                <a href="https://www.windguru.cz" target="_blank" class="tool-link">Windguru</a>
                <a href="https://www.windfinder.com" target="_blank" class="tool-link">Windfinder</a>
                <a href="https://www.iksurfmag.com" target="_blank" class="tool-link">Iksurfmag 评测</a>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>下水记录登记 (Session Log)</h2>
        <div class="log-inputs">
            <input type="date" id="logDate">
            <input type="text" id="logSpot" placeholder="地点 (例: 平潭/博鳌/下川岛)">
            <input type="text" id="logGear" placeholder="装备 (例: 10m + TT板)">
            <input type="text" id="logWind" placeholder="风况 (例: 18-22kt 东北风)">
        </div>
        <button class="btn-action" onclick="addSession()">保存本次 Session</button>

        <table id="sessionTable">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>浪点</th>
                    <th>风况</th>
                    <th>装备搭配</th>
                </tr>
            </thead>
            <tbody id="sessionBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // 初始化日期控件
    document.getElementById('logDate').valueAsDate = new Date();

    // 估算风筝尺寸的实用经验算法
    function calculateKiteSize() {
        const knots = parseFloat(document.getElementById('windKnots').value);
        const weight = parseFloat(document.getElementById('riderWeight').value);
        const output = document.getElementById('calcOutput');

        if (!knots || !weight) {
            output.innerHTML = "请完整输入风速和体重。";
            return;
        }

        if (knots < 10) {
            output.innerHTML = "⚠️ 风力小于 10 节：风力偏弱，建议使用水翼板 (Hydrofoil) 或 15m+ 大气囊/锡力筝。";
            return;
        } else if (knots > 35) {
            output.innerHTML = "⚠️ 风力大于 35 节：超大风红色预警，建议仅限资深选手使用 6m-7m 强风筝，注意安全！";
            return;
        }

        // 双向板标准充气风筝经验面积公式： (体重新系数 / 风速)
        const estimatedSize = Math.round((weight * 2.2 * 1.15) / knots);
        const clampedSize = Math.min(Math.max(estimatedSize, 5), 15);

        output.innerHTML = `
            <strong>推荐风筝尺寸：</strong> <span style="color:var(--accent-cyan); font-size:16px;">${clampedSize} ㎡ 充气筝</span><br>
            <strong>双向板 (TT)：</strong> 建议 ${Math.round(132 + (weight - 65) * 0.3)} - ${Math.round(138 + (weight - 65) * 0.3)} cm<br>
            <strong>评估风力：</strong> 约 ${(knots * 0.514).toFixed(1)} m/s (${knots} Knots)
        `;
    }

    // 本地存储管理 Session
    function loadSessions() {
        const data = JSON.parse(localStorage.getItem('kite_sessions') || '[]');
        const tbody = document.getElementById('sessionBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">暂无记录，输入上方信息保存第一条下水日志</td></tr>';
            return;
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.date}</td>
                <td><strong>${item.spot}</strong></td>
                <td><span class="badge">${item.wind}</span></td>
                <td>${item.gear}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function addSession() {
        const date = document.getElementById('logDate').value;
        const spot = document.getElementById('logSpot').value.trim();
        const gear = document.getElementById('logGear').value.trim();
        const wind = document.getElementById('logWind').value.trim();

        if (!spot || !gear) {
            alert('请至少填写浪点和装备信息');
            return;
        }

        const data = JSON.parse(localStorage.getItem('kite_sessions') || '[]');
        data.unshift({ date, spot, gear, wind: wind || '未记录' });
        localStorage.setItem('kite_sessions', JSON.stringify(data));

        document.getElementById('logSpot').value = '';
        document.getElementById('logGear').value = '';
        document.getElementById('logWind').value = '';

        loadSessions();
    }

    // 默认加载
    calculateKiteSize();
    loadSessions();
</script>

</body>
</html>
