<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kite Life | 实时风况监控与出海日记</title>
    <style>
        :root {
            --primary-ocean: #0077b6;
            --ocean-light: #00b4d8;
            --sky-blue: #90e0ef;
            --foam-white: #e0f2fe;
            --sun-coral: #ff6b6b;
            --sun-yellow: #ffd166;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.7);
            --text-main: #1e293b;
            --text-sub: #475569;
            --shadow-soft: 0 10px 30px rgba(0, 119, 182, 0.08);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #dbeafe 0%, #f0f9ff 40%, #f8fafc 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 32px);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px;
        }

        .brand-title h1 {
            font-size: 23px;
            font-weight: 800;
            color: var(--primary-ocean);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-title span {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* 随身听胶囊 */
        .music-pill {
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            border-radius: 30px;
            padding: 6px 14px;
            box-shadow: 0 4px 16px rgba(0, 119, 182, 0.12);
            gap: 8px;
            border: 1px solid rgba(0, 180, 216, 0.25);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .music-pill:active {
            transform: scale(0.96);
        }

        .disc-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sun-coral), var(--sun-yellow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            transition: transform 0.3s ease;
        }

        .disc-icon.playing {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-ocean);
        }

        /* 卡片公用样式 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 18px 18px;
            box-shadow: var(--shadow-soft);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-ocean);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--ocean-light);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 浪点实时卡片排版 */
        .spots-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid #eef3f8;
            box-shadow: 0 3px 10px rgba(0, 119, 182, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .spot-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .spot-sub {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .arrow-compass {
            display: inline-block;
            font-size: 14px;
            transform-origin: center;
            transition: transform 0.4s ease;
        }

        .spot-metrics {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .wind-speed-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-ocean);
        }

        .wind-speed-val small {
            font-size: 12px;
            font-weight: 600;
        }

        .spot-tag {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .tag-good { background: #dcfce7; color: #166534; }       /* 适合出水 */
        .tag-epic { background: #ffedd5; color: #c2410c; }       /* 狂风大跳 */
        .tag-light { background: #f1f5f9; color: #64748b; }      /* 微风待机 */

        /* 表单与按钮 */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--ocean-light);
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
        }

        .btn-action {
            height: 50px;
            width: 100%;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 119, 182, 0.18);
            transition: transform 0.1s ease;
        }

        .btn-action:active { transform: scale(0.98); }
        .btn-blue { background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%); }
        .btn-orange { background: linear-gradient(135deg, #ff8c72 0%, #ff6b6b 100%); box-shadow: 0 4px 14px rgba(255, 107, 107, 0.25); }

        .result-panel {
            margin-top: 14px;
            background: #f0fdfa;
            border-radius: 14px;
            padding: 14px;
            border: 1px dashed #2dd4bf;
            font-size: 14px;
            line-height: 1.6;
        }

        .kite-tag {
            display: inline-block;
            background: var(--sun-coral);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* 外部风况入口 */
        .radar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .radar-item {
            text-decoration: none;
            background: #ffffff;
            padding: 12px 4px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #f1f5f9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .radar-item .emoji { font-size: 20px; }
        .radar-item .name { font-size: 11px; font-weight: 700; color: var(--text-sub); }

        .session-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-spot { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .session-gear { font-size: 13px; color: var(--text-sub); }
        .wind-badge {
            background: rgba(0, 180, 216, 0.12);
            color: var(--primary-ocean);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
        }
        .session-date { font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-title">
            <h1>🪁 Kite Life</h1>
            <span>浪点实况与日记</span>
        </div>
        
        <div class="music-pill" onclick="toggleBGM()">
            <div class="disc-icon" id="discIcon">▶</div>
            <span class="music-label" id="musicStatus">播放海风 🎵</span>
        </div>
    </header>

    <!-- 背景音乐：同目录下的 bgm.mp3 -->
    <audio id="bgmAudio" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- 专属四大浪点：实时风况监控看板 -->
    <div class="card">
        <div class="card-header-flex">
            <div class="card-title">📡 专属浪点实时风况</div>
            <button class="refresh-btn" onclick="fetchLiveWeather()">🔄 刷新实况</button>
        </div>
        <div class="spots-grid" id="spotsContainer">
            <!-- 动态生成 4 个浪点的气象实况 -->
            <div style="text-align:center; padding:20px; color:#94a3b8; font-size:13px;">正在连接气象雷达获取风况...</div>
        </div>
    </div>

    <!-- 气象雷达链接 -->
    <div class="radar-grid">
        <a href="https://www.windy.com" target="_blank" class="radar-item">
            <span class="emoji">💨</span>
            <span class="name">Windy</span>
        </a>
        <a href="https://www.windguru.cz" target="_blank" class="radar-item">
            <span class="emoji">🌊</span>
            <span class="name">Windguru</span>
        </a>
        <a href="https://www.windfinder.com" target="_blank" class="radar-item">
            <span class="emoji">🎯</span>
            <span class="name">Finder</span>
        </a>
        <a href="https://www.iksurfmag.com" target="_blank" class="radar-item">
            <span class="emoji">🏄‍♂️</span>
            <span class="name">IKSURF</span>
        </a>
    </div>

    <!-- 智能起飞推荐器 -->
    <div class="card">
        <div class="card-title">☀️ 今日起飞计算器</div>
        <div class="input-row">
            <input type="number" id="windInput" placeholder="风速 (Knots/节)" value="18">
            <input type="number" id="weightInput" placeholder="体重 (kg)" value="75">
        </div>
        <button class="btn-action btn-blue" onclick="calculateKite()">⚡ 智能匹配伞号与板型</button>
        
        <div class="result-panel" id="resultCard">
            输入风速与体重为你推荐出水装备。
        </div>
    </div>

    <!-- 浪花打卡记录板 -->
    <div class="card">
        <div class="card-title">🌊 浪花档案 (下水打卡)</div>
        <div class="input-row">
            <input type="date" id="logDate">
            <input type="text" id="logSpot" placeholder="浪点 (如: Kalpitiya)">
        </div>
        <div class="input-row">
            <input type="text" id="logWind" placeholder="风况 (如: 22节 侧岸)">
            <input type="text" id="logGear" placeholder="装备 (如: 9m + TT板)">
        </div>
        <button class="btn-action btn-orange" onclick="saveRecord()">🤙 打卡保存本次 Session</button>

        <div style="margin-top: 16px;" id="recordList"></div>
    </div>
</div>

<script>
    // 1. 指定你的 4 个浪点坐标与信息
    const kiteSpots = [
        { name: "海南 · 博鳌", sub: "亚洲湾/玉带滩", lat: 19.145, lon: 110.589 },
        { name: "福建 · 平潭", sub: "龙凤头/坛南湾", lat: 25.503, lon: 119.791 },
        { name: "斯里兰卡 · Kalpitiya", sub: "Dream Spot 泻湖", lat: 8.232, lon: 79.761 },
        { name: "秦皇岛 · 阿那亚", sub: "黄金海岸", lat: 39.654, lon: 119.336 }
    ];

    // 风向角转罗盘方位名
    function getWindDirectionText(degree) {
        const directions = ['北风', '东北风', '东风', '东南风', '南风', '西南风', '西风', '西北风'];
        const index = Math.round(degree / 45) % 8;
        return directions[index];
    }

    // 批量拉取实时天气 API (Open-Meteo 免密钥开放接口，自动返回 Knots)
    async function fetchLiveWeather() {
        const container = document.getElementById('spotsContainer');
        container.innerHTML = '<div style="text-align:center; padding:15px; color:#94a3b8; font-size:13px;">正在刷新 4 地实时风况...</div>';

        try {
            const spotPromises = kiteSpots.map(async (spot) => {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn`;
                const res = await fetch(url);
                const data = await res.json();
                return {
                    ...spot,
                    speed: Math.round(data.current.wind_speed_10m),
                    gust: Math.round(data.current.wind_gusts_10m),
                    direction: data.current.wind_direction_10m
                };
            });

            const results = await Promise.all(spotPromises);
            renderSpots(results);
        } catch (error) {
            container.innerHTML = '<div style="text-align:center; padding:15px; color:#ef4444; font-size:13px;">实时风况更新失败，请检查网络后重试。</div>';
        }
    }

    // 渲染浪点卡片
    function renderSpots(spots) {
        const container = document.getElementById('spotsContainer');
        container.innerHTML = '';

        spots.forEach(s => {
            let tagClass = 'tag-light';
            let tagText = '微风待机';

            if (s.speed >= 12 && s.speed < 25) {
                tagClass = 'tag-good';
                tagText = '黄金出海 🚀';
            } else if (s.speed >= 25) {
                tagClass = 'tag-epic';
                tagText = '狂风大跳 ⚡';
            }

            const card = document.createElement('div');
            card.className = 'spot-card';
            card.innerHTML = `
                <div class="spot-info">
                    <h3>${s.name}</h3>
                    <div class="spot-sub">
                        <span>${s.sub}</span>
                        <span>·</span>
                        <span class="arrow-compass" style="transform: rotate(${s.direction}deg);">⬇</span>
                        <span>${getWindDirectionText(s.direction)} (${s.direction}°)</span>
                    </div>
                </div>
                <div class="spot-metrics">
                    <div class="wind-speed-val">${s.speed} <small>Kts</small></div>
                    <div style="font-size:11px; color:var(--text-sub);">阵风 ${s.gust} Kts</div>
                    <span class="spot-tag ${tagClass}">${tagText}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 2. 方式 A：无缝播放同目录下的 bgm.mp3
    const audio = document.getElementById('bgmAudio');
    const disc = document.getElementById('discIcon');
    const statusLabel = document.getElementById('musicStatus');

    function toggleBGM() {
        if (audio.paused) {
            audio.play().then(() => {
                disc.innerHTML = "⏸";
                disc.classList.add('playing');
                statusLabel.innerText = "音乐播放中";
            }).catch(error => {
                alert("播放失败：请确保已将歌曲命名为 bgm.mp3，并与本网页放在同级目录！");
            });
        } else {
            audio.pause();
            disc.innerHTML = "▶";
            disc.classList.remove('playing');
            statusLabel.innerText = "已暂停";
        }
    }

    // 3. 起飞算法
    function calculateKite() {
        const knots = parseFloat(document.getElementById('windInput').value);
        const weight = parseFloat(document.getElementById('weightInput').value);
        const output = document.getElementById('resultCard');

        if (!knots || !weight) {
            output.innerHTML = "请完整输入风速和体重。";
            return;
        }

        if (knots < 10) {
            output.innerHTML = "🪶 <strong>微风 (<10节)：</strong> 建议出动 <span class='kite-tag'>15㎡+ 充气筝</span> 或直接玩水翼 (Hydrofoil)。";
            return;
        }
        if (knots > 35) {
            output.innerHTML = "⚠️ <strong>强风预警 (>35节)：</strong> 建议使用 <span class='kite-tag'>6-7㎡ 强风筝</span>，注意安全！";
            return;
        }

        const kiteSize = Math.min(Math.max(Math.round((weight * 2.2 * 1.16) / knots), 5), 14);
        const ttBoard = Math.round(132 + (weight - 65) * 0.35);

        output.innerHTML = `
            <strong>主推尺寸：</strong> <span class="kite-tag">${kiteSize} ㎡ 充气筝</span><br>
            <strong>双向板 (TT)：</strong> 建议 <strong>${ttBoard} cm</strong> 左右<br>
            <strong>折合风速：</strong> 约 ${(knots * 0.514).toFixed(1)} m/s
        `;
    }

    // 4. 下水 Session 日志
    function renderRecords() {
        const list = JSON.parse(localStorage.getItem('kite_sessions_mobile_a') || '[]');
        const container = document.getElementById('recordList');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px; padding:12px 0;">还没有记录，出水了就来记一笔吧 🏖️</div>';
            return;
        }

        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'session-item';
            div.innerHTML = `
                <div>
                    <div class="session-spot">${item.spot}</div>
                    <div class="session-gear">${item.gear}</div>
                </div>
                <div style="text-align:right;">
                    <span class="wind-badge">${item.wind}</span>
                    <div class="session-date">${item.date}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function saveRecord() {
        const date = document.getElementById('logDate').value;
        const spot = document.getElementById('logSpot').value.trim();
        const wind = document.getElementById('logWind').value.trim();
        const gear = document.getElementById('logGear').value.trim();

        if (!spot || !gear) {
            alert('浪点和装备记得填上哦！');
            return;
        }

        const list = JSON.parse(localStorage.getItem('kite_sessions_mobile_a') || '[]');
        list.unshift({ date, spot, wind: wind || '风力良好', gear });
        localStorage.setItem('kite_sessions_mobile_a', JSON.stringify(list));

        document.getElementById('logSpot').value = '';
        document.getElementById('logWind').value = '';
        document.getElementById('logGear').value = '';

        renderRecords();
    }

    // 初始化运行
    document.getElementById('logDate').valueAsDate = new Date();
    calculateKite();
    renderRecords();
    fetchLiveWeather();
</script>

</body>
</html>
