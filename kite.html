<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 专属适配 iPhone 17 Pro Max / 全面屏 iOS 设备：视口、灵动岛安全区与防误触 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kite Life | 风筝冲浪日志与风况</title>
    <style>
        :root {
            --primary-ocean: #0077b6;
            --ocean-light: #00b4d8;
            --sky-blue: #90e0ef;
            --foam-white: #e0f2fe;
            --sun-coral: #ff6b6b;
            --sun-yellow: #ffd166;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.7);
            --text-main: #1e293b;
            --text-sub: #475569;
            --shadow-soft: 0 10px 30px rgba(0, 119, 182, 0.08);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #dbeafe 0%, #f0f9ff 40%, #f8fafc 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 32px);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px; /* 精准适配 iPhone 17 Pro Max 握持与浏览宽度 */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 顶部栏与随身听胶囊 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px;
        }

        .brand-title h1 {
            font-size: 23px;
            font-weight: 800;
            color: var(--primary-ocean);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-title span {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* 极简 BGM 播放器胶囊（方式 A） */
        .music-pill {
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            border-radius: 30px;
            padding: 6px 14px;
            box-shadow: 0 4px 16px rgba(0, 119, 182, 0.12);
            gap: 8px;
            border: 1px solid rgba(0, 180, 216, 0.25);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .music-pill:active {
            transform: scale(0.96);
        }

        .disc-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sun-coral), var(--sun-yellow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            transition: transform 0.3s ease;
        }

        .disc-icon.playing {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-ocean);
        }

        /* 毛玻璃质感卡片 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 18px 18px;
            box-shadow: var(--shadow-soft);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-ocean);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 触控大尺寸优化 (防误触) */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--ocean-light);
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
        }

        .btn-action {
            height: 50px;
            width: 100%;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 119, 182, 0.18);
            transition: transform 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-blue {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
        }

        .btn-orange {
            background: linear-gradient(135deg, #ff8c72 0%, #ff6b6b 100%);
            box-shadow: 0 4px 14px rgba(255, 107, 107, 0.25);
        }

        /* 推荐面板 */
        .result-panel {
            margin-top: 14px;
            background: #f0fdfa;
            border-radius: 14px;
            padding: 14px;
            border: 1px dashed #2dd4bf;
            font-size: 14px;
            line-height: 1.6;
        }

        .kite-tag {
            display: inline-block;
            background: var(--sun-coral);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* 快速外链磁贴 */
        .radar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .radar-item {
            text-decoration: none;
            background: #ffffff;
            padding: 12px 4px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #f1f5f9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .radar-item .emoji {
            font-size: 20px;
        }

        .radar-item .name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
        }

        /* 历史 Session 记录项 */
        .session-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .session-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .session-spot {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .session-gear {
            font-size: 13px;
            color: var(--text-sub);
        }

        .session-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .wind-badge {
            background: rgba(0, 180, 216, 0.12);
            color: var(--primary-ocean);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
        }

        .session-date {
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部状态栏与随身听控制胶囊 -->
    <header>
        <div class="brand-title">
            <h1>🪁 Kite Life</h1>
            <span>海风日记 · 专享版</span>
        </div>
        
        <!-- 点击即可随时播放/暂停同目录下的 bgm.mp3 -->
        <div class="music-pill" onclick="toggleBGM()">
            <div class="disc-icon" id="discIcon">▶</div>
            <span class="music-label" id="musicStatus">播放海风 🎵</span>
        </div>
    </header>

    <!-- 方式 A：直接绑定同级目录下的 bgm.mp3 循环播放 -->
    <audio id="bgmAudio" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- 常用风况入口 -->
    <div class="radar-grid">
        <a href="https://www.windy.com" target="_blank" class="radar-item">
            <span class="emoji">💨</span>
            <span class="name">Windy</span>
        </a>
        <a href="https://www.windguru.cz" target="_blank" class="radar-item">
            <span class="emoji">🌊</span>
            <span class="name">Windguru</span>
        </a>
        <a href="https://www.windfinder.com" target="_blank" class="radar-item">
            <span class="emoji">🎯</span>
            <span class="name">Finder</span>
        </a>
        <a href="https://www.iksurfmag.com" target="_blank" class="radar-item">
            <span class="emoji">🏄‍♂️</span>
            <span class="name">IKSURF</span>
        </a>
    </div>

    <!-- 智能起飞推荐器 -->
    <div class="card">
        <div class="card-title">☀️ 今日起飞计算器</div>
        <div class="input-row">
            <input type="number" id="windInput" placeholder="风速 (Knots/节)" value="19">
            <input type="number" id="weightInput" placeholder="体重 (kg)" value="75">
        </div>
        <button class="btn-action btn-blue" onclick="calculateKite()">⚡ 智能匹配伞号与板型</button>
        
        <div class="result-panel" id="resultCard">
            正在根据风力和体重计算出海搭配...
        </div>
    </div>

    <!-- 浪花打卡记录板 -->
    <div class="card">
        <div class="card-title">🌊 浪花档案 (下水打卡)</div>
        <div class="input-row">
            <input type="date" id="logDate">
            <input type="text" id="logSpot" placeholder="浪点 (例: 平潭/博鳌/后海)">
        </div>
        <div class="input-row">
            <input type="text" id="logWind" placeholder="风况 (例: 18-22节 东北风)">
            <input type="text" id="logGear" placeholder="装备 (例: 10m气囊+TT板)">
        </div>
        <button class="btn-action btn-orange" onclick="saveRecord()">🤙 打卡保存本次 Session</button>

        <div style="margin-top: 16px;" id="recordList">
            <!-- 动态下水记录展示 -->
        </div>
    </div>
</div>

<script>
    // 1. 初始化当前日期
    document.getElementById('logDate').valueAsDate = new Date();

    // 2. 方式 A：控制同目录下的 bgm.mp3
    const audio = document.getElementById('bgmAudio');
    const disc = document.getElementById('discIcon');
    const statusLabel = document.getElementById('musicStatus');

    function toggleBGM() {
        if (audio.paused) {
            audio.play().then(() => {
                disc.innerHTML = "⏸";
                disc.classList.add('playing');
                statusLabel.innerText = "音乐播放中";
            }).catch(error => {
                alert("播放失败：请确保音频文件名为 bgm.mp3，并且和 kite.html 放在服务器的同一目录下！");
            });
        } else {
            audio.pause();
            disc.innerHTML = "▶";
            disc.classList.remove('playing');
            statusLabel.innerText = "已暂停";
        }
    }

    // 3. 智能推算风筝面积与板号
    function calculateKite() {
        const knots = parseFloat(document.getElementById('windInput').value);
        const weight = parseFloat(document.getElementById('weightInput').value);
        const output = document.getElementById('resultCard');

        if (!knots || !weight) {
            output.innerHTML = "请完整输入风速和体重。";
            return;
        }

        if (knots < 10) {
            output.innerHTML = "🪶 <strong>微风工况 (<10节)：</strong> 建议出动 <span class='kite-tag'>15㎡+ 充气筝</span> 或直接玩水翼 (Hydrofoil)。";
            return;
        }
        if (knots > 35) {
            output.innerHTML = "⚠️ <strong>狂风暴走 (>35节)：</strong> 仅建议大乱跳高手使用 <span class='kite-tag'>6-7㎡ 强风筝</span>，下水务必系好安全脱扣！";
            return;
        }

        const kiteSize = Math.min(Math.max(Math.round((weight * 2.2 * 1.16) / knots), 5), 14);
        const ttBoard = Math.round(132 + (weight - 65) * 0.35);

        output.innerHTML = `
            <strong>主推尺寸：</strong> <span class="kite-tag">${kiteSize} ㎡ 充气筝</span><br>
            <strong>双向板 (TT)：</strong> 建议 <strong>${ttBoard} cm</strong> 左右<br>
            <strong>折合风速：</strong> 约 ${(knots * 0.514).toFixed(1)} m/s，非常适合大跳练习与巡航！
        `;
    }

    // 4. Session 记录保存到浏览器本地
    function renderRecords() {
        const list = JSON.parse(localStorage.getItem('kite_sessions_mobile_a') || '[]');
        const container = document.getElementById('recordList');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px; padding:12px 0;">还没有记录，出水了就来记一笔吧 🏖️</div>';
            return;
        }

        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'session-item';
            div.innerHTML = `
                <div class="session-left">
                    <span class="session-spot">${item.spot}</span>
                    <span class="session-gear">${item.gear}</span>
                </div>
                <div class="session-right">
                    <span class="wind-badge">${item.wind}</span>
                    <span class="session-date">${item.date}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function saveRecord() {
        const date = document.getElementById('logDate').value;
        const spot = document.getElementById('logSpot').value.trim();
        const wind = document.getElementById('logWind').value.trim();
        const gear = document.getElementById('logGear').value.trim();

        if (!spot || !gear) {
            alert('浪点和装备记得填上哦！');
            return;
        }

        const list = JSON.parse(localStorage.getItem('kite_sessions_mobile_a') || '[]');
        list.unshift({ date, spot, wind: wind || '风力适中', gear });
        localStorage.setItem('kite_sessions_mobile_a', JSON.stringify(list));

        document.getElementById('logSpot').value = '';
        document.getElementById('logWind').value = '';
        document.getElementById('logGear').value = '';

        renderRecords();
    }

    // 初次运行自动渲染
    calculateKite();
    renderRecords();
</script>

</body>
</html>
