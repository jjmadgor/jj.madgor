<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CHASING THE WIND</title>
    <style>
        :root {
            --ocean-dark: #0a1128;
            --primary: #0077b6;
            --accent-sunset: #ff6b6b;
            --accent-yellow: #ffd166;
            --text-main: #1c2d42;
            --text-sub: #4b6584;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(180deg, #d8f3dc 0%, #e0f2fe 30%, #f4f9fc 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 40px);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px; /* 适配 iPhone 17 Pro Max */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 顶部标题与音乐胶囊 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--ocean-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand p {
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }

        .music-pill {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 6px 14px;
            box-shadow: 0 4px 16px rgba(0, 119, 182, 0.12);
            gap: 8px;
            border: 1px solid rgba(0, 119, 182, 0.15);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .music-pill:active {
            transform: scale(0.96);
        }

        .disc-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-sunset), var(--accent-yellow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            transition: transform 0.3s ease;
        }

        .disc-icon.playing {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ocean-dark);
        }

        /* 时间线日记主卡片 */
        .log-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 16px 36px rgba(10, 17, 40, 0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dashed rgba(0, 119, 182, 0.18);
            padding-bottom: 12px;
        }

        .timeline-date {
            font-size: 18px;
            font-weight: 800;
            color: var(--ocean-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-location {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            background: #e0f2fe;
            padding: 3px 8px;
            border-radius: 6px;
        }

        /* 文案段落样式 */
        .story-text {
            font-size: 15px;
            line-height: 1.9;
            color: var(--text-main);
            text-align: justify;
        }

        .story-text p {
            margin-bottom: 12px;
        }

        .story-text p:last-child {
            margin-bottom: 0;
        }

        /* 视频容器 */
        .video-wrapper {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000000;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
            position: relative;
            margin-top: 4px;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 18px;
            max-height: 520px;
            object-fit: cover;
        }

        .log-footer {
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #8395a7;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部状态栏与播放器 -->
    <header>
        <div class="brand">
            <h1>🌊 CHASING THE WIND</h1>
            <p>从雪域到无垠之海</p>
        </div>
        
        <div class="music-pill" onclick="toggleBGM()">
            <div class="disc-icon" id="discIcon">▶</div>
            <span class="music-label" id="musicStatus">播放海风 🎵</span>
        </div>
    </header>

    <!-- 背景音乐：同目录下的 bgm.mp3 -->
    <audio id="bgmAudio" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- 时间线第一篇：8月31日 抵达日记 -->
    <main class="log-card">
        <div class="timeline-header">
            <div class="timeline-date">🗓️ 8月31日 · 启程与抵达</div>
            <span class="timeline-location">北京 ➔ 成都 ➔ 科伦坡</span>
        </div>

        <div class="story-text">
            <p>机翼刺破云层，从北京到成都，再落进科伦坡的湿夜。</p>
            <p>辗转十数个小时，车轮又在颠簸中丈量了三个小时的雨林与长路。</p>
            <p>窗外掠过的灯火忽明忽暗，把所有的疲惫与心绪，都悄无声息地揉碎在南亚的海风里。</p>
        </div>

        <!-- 视频播放区域：放置于同目录下的 video1.mp4 -->
        <div class="video-wrapper">
            <video controls playsinline preload="metadata" poster="">
                <source src="video1.mp4" type="video/mp4">
                您的浏览器不支持视频播放标签。
            </video>
        </div>

        <div class="log-footer">
            <span>Kalpitiya, Sri Lanka</span>
            <span>Day 1 · Night Landing</span>
        </div>
    </main>
</div>

<script>
    const audio = document.getElementById('bgmAudio');
    const disc = document.getElementById('discIcon');
    const statusLabel = document.getElementById('musicStatus');

    function toggleBGM() {
        if (audio.paused) {
            audio.play().then(() => {
                disc.innerHTML = "⏸";
                disc.classList.add('playing');
                statusLabel.innerText = "音乐播放中";
            }).catch(e => {
                alert("请确保同目录下存放了名为 bgm.mp3 的音频文件");
            });
        } else {
            audio.pause();
            disc.innerHTML = "▶";
            disc.classList.remove('playing');
            statusLabel.innerText = "已暂停";
        }
    }
</script>

</body>
</html>
