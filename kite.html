<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CHASING THE WIND</title>
    <style>
        :root {
            --ocean-dark: #0a1128;
            --primary: #0077b6;
            --accent-sunset: #ff6b6b;
            --accent-yellow: #ffd166;
            --woo-blue: #0099ff;
            --duotone-orange: #ff5500;
            --duotone-dlab: #10b981;
            --danger-red: #e11d48;
            --text-main: #1c2d42;
            --text-sub: #4b6584;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(180deg, #d8f3dc 0%, #e0f2fe 30%, #f4f9fc 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(var(--safe-top) + 20px) 18px calc(var(--safe-bottom) + 40px);
            display: flex;
            justify-content: center;
        }

        /* 全屏密码遮罩 */
        #lockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 17, 40, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 28px 24px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lock-icon {
            font-size: 36px;
            margin-bottom: -4px;
        }

        .lock-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ocean-dark);
        }

        .lock-hint {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: -6px;
        }

        .lock-input {
            width: 100%;
            height: 46px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 6px;
            font-weight: 800;
            outline: none;
            color: var(--ocean-dark);
            background: #f8fafc;
            transition: border-color 0.2s;
        }

        .lock-input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .lock-btn {
            height: 44px;
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.25);
            transition: transform 0.15s;
        }

        .lock-btn:active {
            transform: scale(0.97);
        }

        .error-shake {
            animation: shake 0.35s ease-in-out;
            border-color: var(--accent-sunset) !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--ocean-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand p {
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }

        .music-pill {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 6px 14px;
            box-shadow: 0 4px 16px rgba(0, 119, 182, 0.12);
            gap: 8px;
            border: 1px solid rgba(0, 119, 182, 0.15);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .music-pill:active { transform: scale(0.96); }

        .disc-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-sunset), var(--accent-yellow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            transition: transform 0.3s ease;
        }

        .disc-icon.playing { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .music-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ocean-dark);
        }

        /* 翻页按钮样式 */
        .page-nav {
            display: flex;
            justify-content: center;
            margin-top: -6px;
            margin-bottom: 6px;
        }

        .page-nav.bottom {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, var(--ocean-dark), var(--primary));
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0, 119, 182, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.2);
        }

        .log-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 16px 36px rgba(10, 17, 40, 0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dashed rgba(0, 119, 182, 0.18);
            padding-bottom: 12px;
        }

        .timeline-date {
            font-size: 17px;
            font-weight: 800;
            color: var(--ocean-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-location {
            font-size: 11px;
            color: var(--primary);
            font-weight: 700;
            background: #e0f2fe;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .woo-block {
            background: #ffffff;
            border: 1px solid #e0f0fa;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 14px rgba(0, 153, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .woo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .woo-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 800;
            color: var(--woo-blue);
            background: rgba(0, 153, 255, 0.08);
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .woo-badge.danger {
            color: var(--danger-red);
            background: rgba(225, 29, 72, 0.08);
        }

        .gear-pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--duotone-orange);
            background: #fff5f0;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 85, 0, 0.2);
        }

        .gear-pill.dlab {
            color: #047857;
            background: #ecfdf5;
            border-color: rgba(16, 185, 129, 0.25);
        }

        .woo-highlight-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 14px;
            padding: 14px 8px;
            color: white;
            text-align: center;
        }

        .woo-highlight-item .val {
            font-size: 19px;
            font-weight: 900;
            color: #38bdf8;
            line-height: 1.2;
        }

        .woo-highlight-item .lbl {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
            font-weight: 600;
        }

        .woo-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-cell {
            background: #f8fafc;
            border-radius: 12px;
            padding: 8px 6px;
            text-align: center;
            border: 1px solid #f1f5f9;
        }

        .stat-cell .num {
            font-size: 14px;
            font-weight: 800;
            color: var(--ocean-dark);
        }

        .stat-cell .txt {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
            font-weight: 500;
        }

        .jump-milestone {
            background: #f0f9ff;
            border-left: 3px solid var(--woo-blue);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            color: #0369a1;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .woo-raw-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .woo-raw-images img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            object-fit: contain;
        }

        .story-text {
            font-size: 15px;
            line-height: 1.85;
            color: var(--text-main);
            text-align: justify;
        }

        .story-text p { margin-bottom: 12px; }
        .story-text p:last-child { margin-bottom: 0; }

        .midnight-poetry {
            font-size: 16px;
            line-height: 2.2;
            color: #2c3e50;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 6px 12px;
            border-left: 3px solid var(--accent-sunset);
            background: rgba(255, 107, 107, 0.05);
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
        }

        .video-wrapper {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000000;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
            position: relative;
            margin-top: 4px;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 18px;
            max-height: 520px;
            object-fit: cover;
        }

        .photo-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .photo-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

            object-fit: cover;
